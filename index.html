<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모트모트 온라인 종이마을</title>
<!--
  모트모트 「온라인 종이마을」 웹 프로토타입 — 1~2단계
  ---------------------------------------------------
  [이번 단계 기능]
  1) 시작 화면: 닉네임 간이 로그인, 다시 방문 시 인사 후 바로 입장
  2) 아바타 설정 페이지: 6단계(몸 · 색 · 얼굴 · 헤어/귀 · 옷 · 소품·이름),
     랜덤 만들기, 추천 프리셋 4종, 미리보기 배경 3종, 잠긴 해금 아이템 표시
  3) 호감형 종이 캐릭터: SVG 레이어 조합, 눈 깜빡임 · 숨쉬기 · 두리번 · 클릭 점프 · 손 흔들기 · 랜덤 말풍선
  4) 완성 연출: '사각' 오려내기 효과 → 인사 → 마을로 걸어가기
  5) [2단계] 마을 지도: 모눈 바닥, 접은 종이 건물 5곳, 방향키·WASD·클릭 이동, 충돌 처리,
     건물 앞 입장 위젯(Enter), 돌아다니며 인사하는 주민 4명, 집 지붕 '!' 알림, 캐릭터 말풍선 튜토리얼 3단계
  6) [3단계] 집: 방(플래너·달력·옷장·저금통 클릭), 플래너(다짐·할 일·텐미닛 타임테이블·회고·D-day),
     다짐=출석(도장 연출·연속 보너스·아이템 해금), 출석 달력, 포인트 지갑(쿠폰 교환·노트 추천)
  7) [4단계] 도서관: 뽀모도로(프리셋·직접 설정·과목 선택·알림음), 집중 완료 시 HOME 플래너 타임테이블 자동 칠하기,
     "오늘 끝낸 일은?" 기록(카페 공개 선택), 공부 노트 타이핑(자동 저장), 함께 공부하는 열람실, 마을 상단 타이머 칩
  [디자인] 흰 테두리 제거, 건물 · 나무 · 소품을 아늑한 2D 일러스트풍으로 재작성
  8) [5단계] 스터디 카페: 자리 선택(창가 바 · 마주 앉는 2인 테이블 2개 · 마주 보는 큰 테이블, 14석 중 8석은 주민, 앞줄은 뒷모습으로), 앉기 · 옮기기 · 일어나기,
     내 자리 바(공부 상태 · 집중 타이머 = 도서관과 공유 → 플래너 자동 기록), 이웃에게 응원 보내기 · 이웃이 보내는 응원,
     입장 시 생성형 재즈(피아노 컴핑 · 워킹 베이스 · 브러시 드럼 · 비브라폰, 켜기/끄기 · 음량)
     [익명 우체통 탭]
     도서관 백색소음: 핑크·브라운 노이즈 + 책장 넘기는 소리 · 연필 소리, 빗소리 모드, 끄기, 음량 (입장 시 페이드인, 퇴장 시 페이드아웃) 한 줄 남기기(공부·독서·일상·다짐, 공개/비공개), 편지봉투 카드 피드(우표 = 작성자 캐릭터 얼굴, 닉네임 숨김),
     응원해요 · 나도 그래요 · 멋져요 반응(종이 하트), 내 공개 글에 이웃 응원이 달리는 시뮬레이션 + 🔔 알림, 내 글 탭
  9) [6단계] 분수대 게시판: 이 달의 많이 팔린 노트 TOP5(예시 데이터 · 공식몰 링크), 내 월간 리포트(출석 · 다짐 지킨 비율 · 기록 시간 ·
     적립 포인트 · 하루별 히트맵 · 과목별 막대 · 최근 다짐 · 맞춤 노트 추천, 예시로 미리보기), 자유 게시판(포스트잇 · 색 · 좋아요),
     동전 던지기(하루 1번, 동전 애니메이션 · 물소리 · 소원이 물 위에 둥둥 · 행운 쪽지)
  10) [7단계] 노트 공작소: 이 달의 다이어리(예시 상품 · 공식몰) + 참고 꾸미기 디자인 5종 + 추천 내지 3종,
     나만의 내지 만들기(공부 · 과제 · 독서, 추천 조합 / 빈 페이지, 칸 12종 추가, 끌어서 순서 바꾸기, 페이지 사용량, 이미지 · 양식 코드),
     오늘의 일기 꾸미기(테마 5종 한 번에 적용, 마을 기록 불러오기, 스티커 · 마스킹테이프 · 날짜 도장을 끌어서 배치 · 크기 · 회전 · 삭제, 배경색),
     내 보관함(저장한 양식 · 일기 다시 열기 · 이미지 · 삭제), 결과마다 잘 맞는 노트 추천
  [다음 단계] 8 음악 · 설정 · 시연용 날짜 넘기기(플래너 · 다짐 출석 · 포인트) → 4 도서관 → 5 카페 → 6 분수대 → 7 노트 공작소 → 8 음악·설정
  [실행] 이 파일을 브라우저로 열면 됩니다. 데이터는 이 브라우저의 localStorage에만 저장됩니다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a3330; --ink-soft:#6b625c; --paper:#FFFDF8; --ivory:#FBF7EE; --grid:#ECE5D8;
  --tape:rgba(247,206,110,.6); --accent:#F3A6A0;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .40 0 0 0 0 .33 0 0 0 0 .26 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.006 .07' numOctaves='2' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .42 -.16'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");
  --blot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .47 0 0 0 0 .36 0 0 0 .38 -.17'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
  --hand:'Nanum Pen Script', cursive; --en:'Poppins', 'Gowun Dodum', sans-serif; --body:'Gowun Dodum', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--body); color:var(--ink); background-color:var(--ivory);
  background-image:var(--noise),var(--fiber),var(--blot),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:220px 220px,480px 480px,600px 600px,16px 16px,16px 16px; overflow-x:hidden;
}
button{font-family:inherit;color:inherit}
.screen{display:none;min-height:100vh;padding:28px 20px 70px}
.screen.on{display:block;animation:paperIn .45s ease}
@keyframes paperIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

/* 종이 카드 */
.card{position:relative;background-color:var(--paper);background-image:var(--noise),var(--fiber);background-size:220px 220px,480px 480px;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 5px 0 rgba(58,51,48,.13)}
.tape::before,.tape::after{content:'';position:absolute;width:78px;height:24px;background:var(--tape);top:-13px;border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6)}
.tape::before{left:22px;transform:rotate(-6deg)}
.tape::after{right:22px;transform:rotate(5deg);background:rgba(243,166,160,.5)}

.btn{cursor:pointer;font-size:16px;padding:11px 20px;border:2px solid var(--ink);border-radius:999px;background:#fff;box-shadow:2px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px) rotate(-1deg)}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--ivory)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* 시작 화면 */
#start{display:none;place-items:center}
#start.on{display:grid}
.start-wrap{width:min(560px,100%);text-align:center}
.logo{font-family:var(--hand);font-size:clamp(64px,13vw,104px);line-height:1;margin:6px 0 0;letter-spacing:2px}
.logo span{display:inline-block;animation:wobble 3.2s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.2s}.logo span:nth-child(3){animation-delay:.4s}.logo span:nth-child(4){animation-delay:.6s}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
.sub{color:var(--ink-soft);margin:6px 0 18px;font-size:15px}
.residents{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:170px}
.residents .char-wrap{width:118px}
.residents .char-wrap:nth-child(2){width:136px}
.login{padding:26px 24px 22px;margin-top:6px}
.login label{display:block;font-family:var(--hand);font-size:26px;margin-bottom:10px}
.login input{width:100%;font-family:var(--body);font-size:18px;padding:13px 16px;border:2px solid var(--ink);border-radius:12px;background:#fff;outline:none;text-align:center}
.login input:focus{box-shadow:0 0 0 4px rgba(247,206,110,.5)}
.login .btn{margin-top:14px;width:100%;font-size:18px;padding:13px}
.hint{font-size:13px;color:var(--ink-soft);margin-top:10px;min-height:18px}
.hint.err{color:#c4554c}

/* 캐릭터 */
.char-wrap{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.char-svg{width:100%;height:auto;display:block;overflow:visible}
.char-svg.crop{overflow:hidden}
.c-bob{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1.012,.99)}}
.c-eyes{transform-box:fill-box;transform-origin:50% 50%}
.blink .c-eyes{animation:blink .2s ease}
@keyframes blink{50%{transform:scaleY(.08)}}
.c-face{transition:transform .35s ease}
.lookL .c-face{transform:translateX(-4px)}
.lookR .c-face{transform:translateX(4px)}
.c-arm-r{transform-box:fill-box;transform-origin:50% 50%}
.c-arm-l{transform-box:fill-box;transform-origin:80% 8%}
.wave .c-arm-r{animation:wave .32s ease-in-out 6 alternate}
@keyframes wave{from{transform:translate(0,0)}to{transform:translate(7px,-24px) rotate(-12deg)}}
.jump .char-svg{animation:jump .6s cubic-bezier(.3,.7,.4,1)}
@keyframes jump{0%{transform:none}18%{transform:scale(1.08,.9)}50%{transform:translateY(-30px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.07,.93)}100%{transform:none}}
.char-svg{transform-origin:50% 92%}
.hop .char-svg{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:none}70%{transform:scale(1.05,.94)}80%{transform:translateY(-16px)}90%{transform:translateY(0) scale(1.04,.96)}}

.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,6px) scale(.7);opacity:0;pointer-events:none;
  background:#fff;border:2px solid var(--ink);border-radius:14px;padding:7px 12px;font-size:15px;white-space:nowrap;
  box-shadow:2px 3px 0 rgba(58,51,48,.15);transition:all .25s cubic-bezier(.3,1.5,.5,1);z-index:5}
.bubble::after{content:'';position:absolute;left:50%;top:100%;width:12px;height:12px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translate(-50%,-6px) rotate(45deg)}
.bubble.show{opacity:1;transform:translate(-50%,-4px) scale(1)}

/* 아바타 설정 */
.av-head{max-width:1120px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.av-head h1{font-family:var(--hand);font-size:42px;margin:0;font-weight:400}
.av-head p{margin:0;color:var(--ink-soft);font-size:14px}
.av-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(300px,0.9fr) 1.1fr;gap:26px;align-items:start}
.preview{padding:20px;position:sticky;top:20px}
.stage{position:relative;height:420px;border-radius:12px;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px}
.stage .char-wrap{width:250px;z-index:2}
.stage .bglayer{position:absolute;inset:0;z-index:0}
.bg-grid{background-color:#FFFDF8;background-image:var(--noise),var(--fiber),linear-gradient(#E9E2D4 1px,transparent 1px),linear-gradient(90deg,#E9E2D4 1px,transparent 1px);background-size:220px 220px,480px 480px,13px 13px,13px 13px}
.bg-cover{background:#D9C19B;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:6px 6px}
.bg-cover .stitch{position:absolute;inset:12px;border:2px dashed rgba(255,255,255,.75);border-radius:8px}
.bg-cover .label{position:absolute;top:30px;left:50%;transform:translateX(-50%) rotate(-2deg);background:#FFFDF8;border:2px solid var(--ink);padding:8px 22px;font-family:var(--hand);font-size:28px;border-radius:4px}
.bg-village{background:linear-gradient(#EAF2FA 0 58%,#E6EFDC 58% 100%)}
.bg-village svg{position:absolute;left:0;right:0;bottom:30%;width:100%}
.stage-tools{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.chip{cursor:pointer;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--ivory)}
.nametag{margin:14px auto 0;width:max-content;max-width:100%;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:4px 16px;font-family:var(--hand);font-size:26px;transform:rotate(-1.5deg)}
.nametag small{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-right:6px}

.panel{padding:20px 22px 18px}
.presets{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px dashed #D8D0C2;margin-bottom:16px}
.presets .ttl{width:100%;font-size:13px;color:var(--ink-soft)}
.preset{cursor:pointer;flex:1 1 90px;min-width:86px;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 6px 8px;text-align:center;font-size:13px;transition:transform .15s}
.preset:hover{transform:translateY(-3px) rotate(-1deg)}
.preset .char-svg{width:62px;margin:0 auto}
.rand{background:#FFF3CC}
.rand .dice{font-size:34px;line-height:62px;display:block}

.steps{display:flex;gap:6px;margin-bottom:6px}
.steps button{cursor:pointer;flex:1;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:7px 2px;font-size:12.5px;line-height:1.25}
.steps button b{display:block;font-family:var(--hand);font-size:20px;font-weight:400}
.steps button.on{background:var(--ink);color:var(--ivory)}
.steps button.done{background:#F2ECDF}
.progress{height:8px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:10px 0 18px;background:#fff}
.progress i{display:block;height:100%;background:repeating-linear-gradient(45deg,#F5C76E 0 8px,#F7D58F 8px 16px);transition:width .35s}
.step-title{font-family:var(--hand);font-size:30px;margin:0 0 4px}
.sec{margin:14px 0 6px;font-size:14px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.opt{cursor:pointer;position:relative;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 4px 7px;text-align:center;font-size:13px;transition:transform .15s, box-shadow .15s}
.opt:hover{transform:translateY(-2px)}
.opt.on{box-shadow:0 0 0 3px #F5C76E, 3px 4px 0 var(--ink);background:#FFFBEF}
.opt.on::after{content:'✓';position:absolute;top:-9px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;line-height:22px}
.opt .char-svg{width:74px;margin:0 auto 2px}
.opt.face .char-svg{width:70px}
.opt.locked{cursor:not-allowed;background:#F4F1EA;color:#8d847c}
.opt.locked .char-svg{filter:grayscale(1) opacity(.45)}
.opt.locked .lock{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:24px}
.opt.locked .cond{display:block;font-size:11px;margin-top:2px;line-height:1.3}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{cursor:pointer;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);transition:transform .15s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;user-select:none}
.toggle .tr{width:52px;height:30px;border:2px solid var(--ink);border-radius:99px;background:#fff;position:relative;transition:background .2s}
.toggle .tr::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .2s}
.toggle.on .tr{background:#F7A1A8}
.toggle.on .tr::after{left:25px}
.name-input{width:100%;max-width:320px;font-family:var(--hand);font-size:28px;padding:6px 14px;border:2px solid var(--ink);border-radius:10px;outline:none}
.name-input:focus{box-shadow:0 0 0 4px rgba(247,206,110,.5)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:2px dashed #D8D0C2;flex-wrap:wrap}
.nav .r{display:flex;gap:10px;margin-left:auto}

/* 완성 연출 */
#birth{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(251,247,238,.94);backdrop-filter:blur(3px)}
#birth.on{display:grid}
.birth-box{position:relative;width:300px;height:380px;display:flex;align-items:flex-end;justify-content:center}
.birth-box svg.cut{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cut rect{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:10 8;stroke-dashoffset:0}
.cut.draw rect{animation:cutdraw .9s linear forwards}
@keyframes cutdraw{from{stroke-dashoffset:1300;opacity:1}90%{opacity:1}to{stroke-dashoffset:0;opacity:0}}
.scissors{position:absolute;font-size:34px;top:-10px;left:-10px;opacity:0}
.scissors.go{animation:scis .9s linear forwards}
@keyframes scis{0%{opacity:1;top:-14px;left:-14px}25%{top:-14px;left:270px}50%{top:350px;left:270px}75%{top:350px;left:-14px}99%{opacity:1;top:-14px;left:-14px}100%{opacity:0}}
.birth-char{width:240px;opacity:0;transform:scale(0) rotate(-20deg)}
.birth-char.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.sagak{position:absolute;top:70px;right:-48px;font-family:var(--hand);font-size:44px;transform:rotate(12deg) scale(0);color:#c4554c}
.sagak.pop{animation:pop2 .5s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes pop2{to{transform:rotate(12deg) scale(1)}}
.birth-msg{position:absolute;bottom:-64px;left:50%;transform:translateX(-50%);width:max-content;font-family:var(--hand);font-size:32px;opacity:0;transition:opacity .4s}
.birth-msg.show{opacity:1}
.walkout{animation:walkout 1.4s ease-in forwards}
@keyframes walkout{to{transform:translateX(120vw)}}
.walking .char-svg{animation:step .28s ease-in-out infinite}
@keyframes step{50%{transform:translateY(-7px) rotate(3deg)}}

/* 마을 지도 */
.topbar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 3px}
.me .face{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:#FFF6DA}
.me .face .char-svg{width:40px}
.stat,.iconbtn{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:14px}
.iconbtn{cursor:pointer}
.iconbtn.off{opacity:.55;border-style:dashed}
.sh-head .snd-toggle{font-size:18px;padding:6px 11px}
.sh-head .snd-toggle.off{opacity:.6}
.topbar .sp{flex:1}
#village{padding-top:16px}
.world-wrap{max-width:1240px;margin:12px auto 0;position:relative;height:calc(100vh - 150px);min-height:440px;overflow:hidden;padding:0;background-color:#F4EEE2;touch-action:manipulation}
.world{position:absolute;left:0;top:0;width:1200px;height:780px;transform-origin:0 0;background-color:#FFFDF8;background-image:var(--noise),var(--fiber),var(--blot);background-size:220px 220px,480px 480px,600px 600px;cursor:pointer}
.world::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4000;box-shadow:inset 0 0 90px rgba(150,128,100,.18);background-image:var(--noise);background-size:220px 220px;opacity:.55;mix-blend-mode:multiply}
.world.grid{background-image:var(--noise),var(--fiber),var(--blot),linear-gradient(#E6DECF 1.2px,transparent 1.2px),linear-gradient(90deg,#E6DECF 1.2px,transparent 1.2px),linear-gradient(#D9CFBD 1.6px,transparent 1.6px),linear-gradient(90deg,#D9CFBD 1.6px,transparent 1.6px);background-size:220px 220px,480px 480px,600px 600px,20px 20px,20px 20px,100px 100px,100px 100px}
.floor{position:absolute;inset:0;pointer-events:none}
.sprite{position:absolute;pointer-events:none}
.sprite svg{width:100%;height:100%;display:block;overflow:visible}
.bld{pointer-events:auto;cursor:pointer;transition:transform .2s}
.bld:hover{transform:translateY(-4px)}
.bld.near{transform:translateY(-4px) scale(1.02)}
.actor{position:absolute;width:76px;left:0;top:0;will-change:transform}
.actor .char-wrap{width:100%}
.actor .tag{position:absolute;left:50%;top:91%;transform:translateX(-50%);font-size:12px;background:rgba(255,255,255,.92);border:1.5px solid var(--ink);border-radius:99px;padding:0 8px;white-space:nowrap;pointer-events:none}
.actor.me-actor .tag{background:var(--ink);color:var(--ivory)}
.flip .svgbox{transform:scaleX(-1)}
.enter-pop{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:18px;box-shadow:3px 4px 0 rgba(58,51,48,.2);z-index:3000;animation:popIn .3s cubic-bezier(.3,1.6,.5,1);cursor:default}
.enter-pop::after{content:'';position:absolute;left:50%;top:100%;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translate(-50%,-7px) rotate(45deg)}
.enter-pop button{cursor:pointer;font-family:inherit;font-size:16px;background:var(--ink);color:var(--ivory);border:0;border-radius:999px;padding:7px 14px}
.enter-pop small{font-size:12px;color:var(--ink-soft)}
@keyframes popIn{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.alert-mark{position:absolute;transform:translate(-50%,-100%);width:40px;height:40px;border-radius:50%;background:#F5C76E;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:700;z-index:2900;animation:bounceY .9s ease-in-out infinite;pointer-events:none;box-shadow:2px 3px 0 rgba(58,51,48,.2)}
.tut-arrow{position:absolute;transform:translate(-50%,-100%);font-size:40px;z-index:2950;animation:bounceY .8s ease-in-out infinite;pointer-events:none}
@keyframes bounceY{0%,100%{margin-top:0}50%{margin-top:-10px}}
.dust{position:absolute;width:10px;height:10px;border-radius:50%;background:#D8CEBF;pointer-events:none;animation:dust .6s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),-10px) scale(.2);opacity:0}}
.tap-ring{position:absolute;width:30px;height:12px;border:2px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{opacity:.8;width:10px;height:4px}to{opacity:0;width:44px;height:18px}}
.tut-card{position:absolute;left:14px;bottom:14px;z-index:5;padding:12px 14px 12px 16px;font-size:14.5px;display:flex;gap:12px;align-items:center;max-width:min(460px,calc(100% - 28px))}
.tut-card b{font-family:var(--hand);font-size:22px;font-weight:400;margin-right:4px}
.tut-card .btn{padding:6px 12px;font-size:13px;white-space:nowrap}
.hud-help{position:absolute;right:12px;top:12px;z-index:5;font-size:12.5px;background:rgba(255,253,248,.93);border:1.5px dashed var(--ink);border-radius:10px;padding:6px 10px;line-height:1.5}
.runin{animation:runin 1.2s ease-out}
@keyframes runin{from{transform:translateX(-300px)}to{transform:none}}
.en{font-family:var(--en);font-weight:800;letter-spacing:.6px}
/* 공간 패널 */
.space{position:fixed;inset:0;z-index:60;background:rgba(58,51,48,.38);display:none;place-items:center;padding:20px}
.space.on{display:grid}
.space .sheet{width:min(820px,100%);max-height:calc(100vh - 50px);overflow:auto;padding:0;transform-origin:50% 0;animation:unfold .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes unfold{from{transform:scaleY(.15) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.sh-head{padding:16px 22px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:12px;border-radius:14px 14px 0 0}
.sh-head h2{margin:0;font-family:var(--hand);font-size:36px;font-weight:400}
.sh-head h2.en{font-family:var(--en);font-size:26px;font-weight:800}
.sh-head .ko{font-size:14px;color:var(--ink-soft)}
.sh-head .em{font-size:34px}
.sh-head .sp{flex:1}
.sh-body{padding:22px 24px 24px}
.coming{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.coming .who .char-wrap{width:140px}
.stamp{display:inline-block;border:3px solid #c4554c;color:#c4554c;font-family:var(--hand);font-size:26px;padding:0 12px;border-radius:8px;transform:rotate(-6deg);margin-bottom:8px}
.coming ul{margin:8px 0 0;padding-left:20px;line-height:1.8}
.coming p{margin:4px 0;color:var(--ink-soft)}
.sh-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (max-width:640px){#sndVol{display:none}.topbar{gap:6px;padding:6px 8px}.stat,.iconbtn{font-size:12px;padding:4px 9px}.me{padding-right:10px;font-size:13px}.me .face,.me .face .char-svg{width:30px;height:30px}#village{padding:10px 8px 50px}.world-wrap{height:calc(100vh - 160px)}.coming{grid-template-columns:1fr;text-align:center}.coming .who{display:flex;justify-content:center}.coming ul{text-align:left}.hud-help{display:none}}

/* ===== 3단계: 집 ===== */
.space .sheet.wide{width:min(1100px,100%)}
.htabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px 0}
.htabs button{cursor:pointer;border:2px solid var(--ink);border-bottom:0;background:#fff;border-radius:12px 12px 0 0;padding:8px 14px;font-size:14px;position:relative;top:2px}
.htabs button.on{background:#FFFBEF;font-weight:700}
.hbody{border-top:2px solid var(--ink);padding:20px 22px 24px;background:rgba(255,251,239,.6)}
.room{position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#FBF6EC}
.room svg{display:block;width:100%;height:auto}
.room .obj{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.room .obj:hover{transform:translateY(-5px)}
.room .obj:hover .otag rect{fill:#FFF0BA}
.room-char{position:absolute;width:12%;left:61%;bottom:2%}
.room-char .char-wrap{width:100%}
.room-hint{text-align:center;color:var(--ink-soft);font-size:14px;margin:10px 0 0}
/* 플래너 */
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pnav .d{font-family:var(--en);font-weight:700;font-size:18px}
.pnav .ro{font-size:13px;color:#c4554c;background:#FCEBE9;border-radius:99px;padding:3px 10px}
.pbtn{cursor:pointer;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:5px 10px;font-size:14px}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.book{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:4px 6px 0 rgba(58,51,48,.12)}
.page{position:relative;padding:18px 18px 20px;background-color:#FFFDF6;background-image:var(--noise),linear-gradient(#EFE7D8 1px,transparent 1px),linear-gradient(90deg,#EFE7D8 1px,transparent 1px);background-size:220px 220px,14px 14px,14px 14px}
.page.left{border-right:2px solid var(--ink);box-shadow:inset -14px 0 18px -14px rgba(58,51,48,.3)}
.page.right{box-shadow:inset 14px 0 18px -14px rgba(58,51,48,.3)}
.plabel{font-size:13px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.dday{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px;flex-wrap:wrap}
.dday .tagd{font-family:var(--en);font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px}
.dday input{font-family:inherit;font-size:13px;border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;background:#fff}
.pledge{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px 12px;margin-bottom:16px}
.pledge input[type=text]{width:100%;font-family:var(--hand);font-size:30px;border:0;border-bottom:2px dashed #CFC5B3;background:transparent;outline:none;padding:2px 2px 4px}
.pledge input[type=text]:disabled{color:var(--ink)}
.pledge .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.pledge .ph{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.pledge .ph.err{color:#c4554c}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.att-stamp{position:absolute;right:74px;top:-30px;width:86px;height:86px;border:4px double #D2544A;border-radius:50%;color:#D2544A;display:grid;place-items:center;font-family:var(--hand);font-size:30px;line-height:.9;text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.55);pointer-events:none}
.att-stamp small{display:block;font-family:var(--en);font-size:9px;font-weight:700;letter-spacing:1px}
.att-stamp.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{0%{transform:rotate(-14deg) scale(3);opacity:0}60%{transform:rotate(-14deg) scale(.9);opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.plus{position:absolute;font-family:var(--en);font-weight:800;color:#E0823A;font-size:24px;pointer-events:none;animation:plusUp 1.3s ease-out forwards;z-index:5}
@keyframes plusUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1.5px dashed #E1D8C8;font-size:15px}
.todo li.done span{text-decoration:line-through;color:#A39A90}
.todo li span{flex:1;word-break:break-all}
.todo li button{cursor:pointer;border:0;background:none;font-size:16px;color:#A39A90}
.todo input[type=checkbox],.chk input{width:18px;height:18px;accent-color:#3a3330}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;font-family:inherit;font-size:14px;border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;background:#fff}
.mini-me{position:absolute;right:10px;top:6px;width:58px}
.mini-me .char-wrap{width:100%}
.cats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.cats button{cursor:pointer;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;font-size:12.5px;background:#fff;display:inline-flex;align-items:center;gap:5px}
.cats button i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
.cats button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.tt{border:2px solid var(--ink);border-radius:6px;background:#fff;user-select:none;touch-action:none}
.tt .r{display:grid;grid-template-columns:30px repeat(6,1fr);border-bottom:1px solid #E6DECF}
.tt .r:last-child{border-bottom:0}
.tt .h{font-family:var(--en);font-size:11px;font-weight:600;display:grid;place-items:center;border-right:1.5px solid var(--ink);color:var(--ink-soft)}
.tt .c{height:15px;border-right:1px dashed #E6DECF}
.tt .c:nth-child(4){border-right:1px solid #D9CFBD}
.tt .c:last-child{border-right:0}
.tt.edit .c{cursor:crosshair}
.tt.erasing .c{cursor:not-allowed}
.tt-sum{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;font-size:13.5px}
.tt-sum b{font-family:var(--en);font-size:16px}
.bars{display:flex;height:10px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.review{margin-top:14px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.review .opts3{display:flex;gap:8px;margin:6px 0}
.review .opts3 button{cursor:pointer;flex:1;font-size:22px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px}
.review .opts3 button.on{background:#FFF0BA;box-shadow:inset 0 0 0 2px #F5C76E}
.review input{width:100%;font-family:inherit;font-size:14px;border:0;border-bottom:1.5px dashed #CFC5B3;padding:5px 2px;background:transparent;outline:none}
/* 달력 */
.cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-top .m{font-family:var(--en);font-weight:800;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:4px 11px;font-size:13px}
.goal{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.goal .bar{height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:6px;background:#fff}
.goal .bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#F5C76E 0 8px,#F7D58F 8px 16px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-family:var(--en);font-size:12px;font-weight:700;color:var(--ink-soft)}
.cal .day{position:relative;min-height:74px;background:#fff;border:1.5px solid #D8CFBF;border-radius:8px;padding:4px 6px;font-family:var(--en);font-size:13px;cursor:pointer}
.cal .day.empty{background:transparent;border:0;cursor:default}
.cal .day.today{border:2.5px solid var(--ink)}
.cal .day.future{opacity:.45;cursor:default}
.cal .day .st{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-12deg);width:44px;height:44px;border:3px double #D2544A;border-radius:50%;color:#D2544A;font-family:var(--hand);font-size:19px;display:grid;place-items:center;background:rgba(255,255,255,.6)}
.cal .day:hover .tip{display:block}
.cal .tip{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--body);font-size:12.5px;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:5;max-width:240px;overflow:hidden;text-overflow:ellipsis}
/* 저금통 */
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wbox{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px}
.wbox h3{margin:0 0 8px;font-size:15px}
.bal{font-family:var(--en);font-weight:800;font-size:44px;line-height:1.1}
.rules{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.rules td{padding:4px 2px;border-bottom:1px dashed #E1D8C8}
.rules td:last-child{text-align:right;font-family:var(--en);font-weight:700}
.reward{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed #E1D8C8}
.reward:last-child{border-bottom:0}
.reward .ic{font-size:26px}
.reward .t{flex:1;font-size:14px}
.reward .t small{display:block;color:var(--ink-soft);font-size:12px}
.reward .btn{padding:7px 14px;font-size:14px}
.hist{max-height:190px;overflow:auto;font-size:13px}
.hist div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #E1D8C8}
.hist b{font-family:var(--en)}
.rec{display:flex;gap:12px;align-items:center}
.rec .ic{font-size:40px}
.rec a{color:inherit}
.coupon{display:flex;align-items:center;gap:8px;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;background:#FFFBEF}
.coupon code{font-family:var(--en);font-weight:700;flex:1}
.notice{font-size:12.5px;color:var(--ink-soft);margin-top:12px;text-align:center}
.pop-over{position:absolute;inset:0;background:rgba(58,51,48,.35);display:grid;place-items:center;z-index:20;border-radius:14px}
.pop-over .card{padding:22px;max-width:360px;text-align:center}
.pop-over .big{font-size:46px}
.pop-over code{display:block;font-family:var(--en);font-weight:800;font-size:22px;border:2px dashed var(--ink);border-radius:10px;padding:10px;margin:10px 0;background:#FFFBEF;letter-spacing:1px}
.pop-over .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:760px){
  .hide-m,.sh-head .ko{display:none}
  .sh-head{padding:10px 14px}.sh-head .btn{padding:8px 12px;font-size:14px}
  .pledge input[type=text]{font-size:23px}
  .att-stamp{right:6px;top:-26px;width:70px;height:70px;font-size:24px}
  .book,.wallet{grid-template-columns:1fr}
  .page.left{border-right:0;border-bottom:2px solid var(--ink)}
  .cal .day{min-height:52px;font-size:11px}
  .cal .day .st{width:32px;height:32px;font-size:14px}
  .htabs button{padding:6px 9px;font-size:12.5px}
  .hbody{padding:14px 12px 18px}
}

/* ===== 4단계: 도서관 ===== */
.lib{display:grid;grid-template-columns:330px 1fr;gap:18px}
.tbox{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;text-align:center}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ct{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .tm{font-family:var(--en);font-weight:800;font-size:46px;line-height:1}
.ring .md{font-size:14px;margin-top:6px;padding:2px 12px;border-radius:99px;background:#F2ECDF}
.ring .md.focus{background:#DCE6FA}.ring .md.break{background:#DFF2DA}
.tpre{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 8px}
.tpre button{cursor:pointer;border:2px solid var(--ink);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px}

.postit.new{animation:stick .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stick{from{transform:scale(1.4) rotate(0);opacity:0}}
.pwrite{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#FFFDF6;border:2px solid #5b4636;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pwrite input{flex:1;min-width:180px;font-family:var(--hand);font-size:24px;border:0;border-bottom:2px dashed #CFC5B3;outline:none;background:transparent}
.pcols{display:flex;gap:6px}
.pcols button{cursor:pointer;width:26px;height:26px;border-radius:6px;border:2px solid #5b4636}
.pcols button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #5b4636}
.wishwrap{position:relative;border:2px solid #5b4636;border-radius:14px;overflow:hidden;background:linear-gradient(#EAF4FB 0 40%,#F3EADA 40%)}
.wishwrap svg.scene{display:block;width:100%;height:auto}
.water-zone{position:absolute;left:17%;right:17%;top:57%;height:33%}
.wish{position:absolute;font-family:var(--hand);font-size:19px;background:#FFFDF6;border:1.6px solid #5b4636;border-radius:8px;padding:2px 10px;white-space:nowrap;box-shadow:1px 3px 0 rgba(91,70,54,.15);animation:float 6s ease-in-out infinite;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.wish.mine{background:#FFF0BA}
.wish::before{content:'🪙';font-size:13px;margin-right:4px}
@keyframes float{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(10px,-6px) rotate(2deg)}}
.coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B8,#F5C76E 55%,#C99A2E);border:2px solid #8a6a1e;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:13px;color:#7a5a14;z-index:6}
.splash{position:absolute;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:splash .9s ease-out forwards;z-index:5}
@keyframes splash{from{width:10px;height:4px;opacity:1}to{width:150px;height:44px;opacity:0}}
.wish-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.wish-form input{flex:1;min-width:200px;font-family:var(--hand);font-size:26px;border:0;border-bottom:2px dashed #CFC5B3;outline:none;background:transparent;padding:2px 4px}
.luck{margin-top:12px;background:#FFFDF6;border:2px dashed #5b4636;border-radius:12px;padding:10px 14px;font-size:14.5px}
.luck b{font-family:var(--hand);font-size:24px;font-weight:400}
.mywish{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.mywish li{padding:5px 0;border-bottom:1px dashed #E1D8C8}
@media (max-width:860px){.rank{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}.rep-grid{grid-template-columns:1fr}.postit{width:calc(50% - 10px)}.water-zone{position:static;display:flex;flex-wrap:wrap;gap:8px;padding:10px 10px 14px;background:#F3EADA;height:auto}.wish{position:static;font-size:16px;max-width:100%}}


/* 마주 앉는 테이블 */
.ftable{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:34px;min-width:max-content;margin:0 auto}
.frow{display:flex;gap:6px;justify-content:center;position:relative}
.frow.back{z-index:1}
.ftop{position:relative;z-index:2;height:76px;margin-top:-58px;border:2.6px solid #5b4636;border-radius:16px;background:linear-gradient(#E9B888,#C48A58);box-shadow:inset 0 6px 0 rgba(255,255,255,.25),0 5px 0 rgba(91,70,54,.18)}
.ftable.n1 .ftop{width:150px}.ftable.n3 .ftop{width:370px}
.ftop .dec{position:absolute;top:22px;font-size:20px;transform:translateX(-50%)}
.ftop .mid{position:absolute;left:8%;right:8%;top:50%;border-top:2px dashed rgba(91,70,54,.25)}
.frow.front{z-index:3;margin-top:-50px}
.cseat.front .who{top:4px;z-index:1}
.cseat.front .chairback{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:70px;height:60px;border:2.4px solid #5b4636;border-radius:20px 20px 8px 8px;background:linear-gradient(#9FD3AA,#73B583);z-index:2}
.cseat.front .chairback::after{content:'';position:absolute;left:10px;right:10px;top:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.4)}
.cseat.front.empty .chairback{bottom:20px}
.cseat.front.empty .sit{top:auto;bottom:50px}
.cseat.front.empty:hover .chairback{transform:translateX(-50%) translateY(-3px)}
.cseat.front .nm{bottom:12px;z-index:4}
.cseat.front.mine::after{bottom:12px}
.cseat.front .sbub{top:auto;bottom:-34px}
.cseat.front.talk .sbub{opacity:1}
.frow.front{padding-bottom:34px}
.cseat.front .who .bubble{bottom:auto;top:-20px}
@media (max-width:860px){.mybar{padding:8px 12px;gap:8px}.mybar .face,.mybar .stats,.mybar .sp{display:none}.mybar input{width:100%;order:9;padding:5px 9px}.mybar .clock{font-size:22px;min-width:70px}.mybar .btn{padding:6px 10px;font-size:13px}
.ftable.n3 .ftop{width:290px}.ftable.n1 .ftop{width:120px}.cseat.front .chairback{width:56px;height:52px}}

/* ===== 7단계: 노트 공작소 ===== */
.ws-hero{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center;background:#FFF6EA;border:2px solid #5b4636;border-radius:16px;padding:18px 22px;margin-bottom:18px}
.ws-hero svg{width:100%;height:auto;display:block}
.ws-hero h3{margin:0;font-family:var(--en);font-weight:800;font-size:22px;letter-spacing:.5px}
.ws-hero .ko{font-size:14px;color:var(--ink-soft);margin:2px 0 10px}
.ws-hero ul{margin:0 0 14px;padding-left:18px;line-height:1.8;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gcard{background:#fff;border:2px solid #5b4636;border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:8px}
.gcard svg{width:100%;height:auto;border-radius:6px;display:block;box-shadow:0 3px 0 rgba(91,70,54,.12)}
.gcard b{font-size:14px}
.gcard .btn{padding:6px 10px;font-size:12.5px}
.wsec{font-weight:700;font-size:15px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.wsec small{font-weight:400;color:var(--ink-soft);font-size:12.5px}
.maker{display:grid;grid-template-columns:1fr minmax(300px,420px);gap:20px;align-items:start}
.mk-panel{background:#fff;border:2px solid #5b4636;border-radius:14px;padding:14px 16px}
.mk-panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-bottom:12px}
.palette button{cursor:pointer;border:1.8px solid #5b4636;background:#FFFDF6;border-radius:10px;padding:6px 8px;font-size:12.5px;text-align:left;display:flex;align-items:center;gap:6px}
.palette button:hover{background:#FFF0D9}
.palette button i{font-style:normal;font-size:15px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blist li{display:flex;align-items:center;gap:8px;border:2px solid #5b4636;border-radius:10px;padding:6px 8px;background:#FFFBF2;font-size:13.5px;cursor:grab}
.blist li.drag{opacity:.4}
.blist li.over{box-shadow:0 -3px 0 #E0823A}
.blist li .hd{color:#B9A58C;letter-spacing:-2px}
.blist li span{flex:1;text-align:left}
.blist li span.hd{flex:none}
.blist li button{cursor:pointer;border:1.5px solid #5b4636;background:#fff;border-radius:7px;width:26px;height:26px;font-size:12px;padding:0}
.meter{height:12px;border:2px solid #5b4636;border-radius:99px;overflow:hidden;background:#fff;margin:6px 0 2px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,#F7B375 0 8px,#FFC992 8px 16px);transition:width .3s}
.meter.over i{background:repeating-linear-gradient(45deg,#E0574B 0 8px,#F07A6E 8px 16px)}
.mk-preview{position:sticky;top:0}
.mk-preview .pg{background:#fff;border:2px solid #5b4636;border-radius:6px;box-shadow:5px 7px 0 rgba(91,70,54,.15);overflow:hidden}
.mk-preview .pg svg{display:block;width:100%;height:auto}
.mk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mk-actions .btn{padding:8px 12px;font-size:13.5px}
.nm-in{font-family:inherit;font-size:15px;border:1.5px solid #5b4636;border-radius:9px;padding:6px 10px;flex:1;min-width:140px;background:#fff}
.rec-mini{display:flex;gap:10px;align-items:center;background:#FFF6D8;border:2px dashed #E0B44A;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13.5px}
.rec-mini .ic{font-size:30px}
.rec-mini .btn{padding:6px 11px;font-size:12.5px;margin-left:auto;white-space:nowrap}
.dk-tools{display:flex;flex-direction:column;gap:12px}
.themes{display:flex;gap:6px;flex-wrap:wrap}
.themes button{cursor:pointer;border:2px solid #5b4636;border-radius:99px;padding:5px 12px;font-size:13px;background:#fff;display:flex;align-items:center;gap:6px}
.themes button i{width:14px;height:14px;border-radius:50%;border:1.5px solid #5b4636;display:inline-block}
.themes button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #5b4636}
.stk{display:flex;gap:4px;flex-wrap:wrap}
.stk button{cursor:pointer;border:1.6px solid #5b4636;background:#FFFDF6;border-radius:9px;width:40px;height:40px;font-size:21px;padding:0}
.stk button:hover{background:#FFF0D9;transform:scale(1.08)}
.stk button.tape{width:54px;font-size:11px}
.bgs{display:flex;gap:6px;flex-wrap:wrap}
.bgs button{cursor:pointer;width:30px;height:30px;border-radius:50%;border:2px solid #5b4636}
.dtext{width:100%;min-height:92px;font-family:var(--hand);font-size:22px;line-height:1.3;border:2px solid #5b4636;border-radius:10px;padding:6px 10px;resize:vertical;background:#FFFDF6;outline:none}
.srcs{display:flex;gap:5px;flex-wrap:wrap}
.srcs button{cursor:pointer;border:1.5px solid #5b4636;background:#fff;border-radius:99px;padding:3px 9px;font-size:12px}
.seltool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;min-height:34px;background:#FFFBF2;border:1.5px dashed #5b4636;border-radius:10px;padding:5px 8px}
.seltool button{cursor:pointer;border:1.5px solid #5b4636;background:#fff;border-radius:8px;padding:3px 9px;font-size:13px}
.dk-canvas{touch-action:none;user-select:none}
.dk-canvas .ditem{cursor:grab}
.dk-canvas .ditem.sel{cursor:grabbing}
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.vault .pbtn{padding:3px 8px;font-size:12px;white-space:nowrap}
.vault .gcard small{color:var(--ink-soft);font-size:11.5px}
.vault .gcard .row2{display:flex;gap:6px;justify-content:center}
.imgpop img{max-width:100%;max-height:60vh;border:2px solid #5b4636;border-radius:6px;display:block;margin:8px auto}
@media (max-width:860px){.sh-head h2.en{font-size:19px}.ws-hero{grid-template-columns:1fr}.ws-hero svg{max-width:220px;margin:0 auto}.maker{grid-template-columns:1fr}.mk-preview{position:relative}}

#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-120px);z-index:80;background:var(--ink);color:var(--ivory);padding:12px 22px;border-radius:999px;font-size:16px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(58,51,48,.35);display:none;place-items:center;z-index:70}
.modal.on{display:grid}
.modal .card{padding:22px;max-width:340px;text-align:center}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:16px}

footer{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:var(--ink-soft);padding:7px;background:rgba(251,247,238,.9);border-top:1px dashed #D8D0C2;z-index:40}

@media (max-width:860px){
  .av-grid{grid-template-columns:1fr}
  .preview{position:relative;top:0}
  .stage{height:300px}
  .stage .char-wrap{width:180px}
  .steps button{font-size:11px}
  .steps button b{font-size:17px}
}
</style>
</head>
<body>

<!-- 1. 시작 화면 -->
<section id="start" class="screen">
  <div class="start-wrap">
    <div class="residents" id="residents"></div>
    <h1 class="logo"><span>종</span><span>이</span><span>마</span><span>을</span></h1>
    <p class="sub">모트모트 노트의 모눈 위에 세운, 작은 하루를 모으는 마을</p>
    <form class="card tape login" id="loginForm" autocomplete="off">
      <label for="nick">마을에서 불릴 이름은?</label>
      <input id="nick" maxlength="10" placeholder="닉네임 (최대 10자)">
      <button class="btn primary" type="submit">마을 입장 →</button>
      <div class="hint" id="loginHint">처음이라면 내 종이 캐릭터부터 만들어요</div>
    </form>
  </div>
</section>

<!-- 2. 아바타 설정 -->
<section id="avatar" class="screen">
  <div class="av-head">
    <div>
      <h1 id="avTitle">나만의 종이 주민 만들기</h1>
      <p id="avSub">마을에서 함께 다닐 캐릭터예요. 언제든 집 옷장에서 다시 꾸밀 수 있어요.</p>
    </div>
  </div>
  <div class="av-grid">
    <div class="card tape preview">
      <div class="stage" id="stage"><div class="bglayer" id="bglayer"></div></div>
      <div class="stage-tools" id="bgTools">
        <button class="chip on" data-bg="grid">모눈 종이</button>
        <button class="chip" data-bg="cover">노트 표지</button>
        <button class="chip" data-bg="village">마을 풍경</button>
      </div>
      <div class="nametag" id="nametag"><small>이름</small><span>아직 없음</span></div>
    </div>
    <div class="card panel">
      <div class="presets" id="presets"></div>
      <div class="steps" id="steps"></div>
      <div class="progress"><i id="prog"></i></div>
      <div id="stepBody"></div>
      <div class="nav">
        <button class="btn ghost" id="prevBtn">← 이전</button>
        <div class="r">
          <button class="btn" id="nextBtn">다음 →</button>
          <button class="btn primary" id="doneBtn">완성하기 ✂</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 3. 마을 지도 -->
<section id="village" class="screen">
  <div class="topbar card">
    <div class="me" id="meBtn" title="아바타 다시 꾸미기"><div class="face" id="meFace"></div><span id="meName"></span></div>
    <div class="stat">🪙 <b id="pt">0</b>P</div>
    <div class="stat">🔥 연속 출석 <b id="streak">0</b>일</div>
    <div class="stat" id="todayStat">⬜ 오늘 출석 전</div>
    <div class="stat bell-chip" id="bellChip" style="display:none" title="받은 응원">🔔 <b id="bellN">0</b></div>
    <div class="stat timer-chip" id="timerChip" style="display:none" title="도서관 타이머">⏱ <b id="timerChipT">25:00</b> <span id="timerChipM">집중</span></div>
    <div class="sp"></div>
    <button class="iconbtn" id="sndBtn">🔊 소리 켜짐</button><input type="range" id="sndVol" min="0" max="1" step="0.05" style="width:80px;accent-color:#3a3330" aria-label="전체 음량">
    <button class="iconbtn" id="gridBtn">▦ 모눈 켜짐</button>
    <button class="iconbtn" id="resetBtn">처음으로</button>
  </div>
  <div class="world-wrap card" id="worldWrap">
    <div class="world grid" id="world"></div>
    <div class="hud-help">⌨️ 방향키 · WASD로 이동<br>🖱 원하는 곳 · 건물 클릭<br>⏎ 건물 앞에서 Enter로 입장</div>
    <div class="card tut-card" id="tutCard" style="display:none"></div>
  </div>
</section>

<!-- 공간 패널 (건물 안) -->
<div class="space" id="space"><div class="card sheet" id="spaceSheet"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- 흰 테두리 없이 부드러운 그림자만 -->
  <filter id="paperB" x="-10%" y="-10%" width="120%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/><feOffset in="b" dx="2" dy="4" result="o"/>
    <feFlood flood-color="#5b4636" flood-opacity=".22" result="c"/><feComposite in="c" in2="o" operator="in" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="gRoofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9E3A5"/><stop offset="1" stop-color="#74B583"/></linearGradient>
  <linearGradient id="gRoofN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93A4CC"/><stop offset="1" stop-color="#5B6A93"/></linearGradient>
  <linearGradient id="gRoofB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7A274"/><stop offset="1" stop-color="#A06E47"/></linearGradient>
  <linearGradient id="gRoofO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC992"/><stop offset="1" stop-color="#EE9149"/></linearGradient>
  <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EC"/><stop offset="1" stop-color="#F0DFC3"/></linearGradient>
  <linearGradient id="gWallP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#F3D6C2"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDA673"/><stop offset="1" stop-color="#B07648"/></linearGradient>
  <linearGradient id="gWoodN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F80AA"/><stop offset="1" stop-color="#4A5880"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7CF"/><stop offset="1" stop-color="#FFD272"/></linearGradient>
  <linearGradient id="gStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F1EA"/><stop offset="1" stop-color="#D6CCBE"/></linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3F0FF"/><stop offset="1" stop-color="#8CCBEA"/></linearGradient>
  <linearGradient id="gCol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5D9C6"/></linearGradient>
  <linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C59670"/><stop offset="1" stop-color="#8E6544"/></linearGradient>
  <linearGradient id="gIron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A6A60"/><stop offset="1" stop-color="#3F342E"/></linearGradient>
  <linearGradient id="gCork" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBD9B6"/><stop offset="1" stop-color="#D8BE90"/></linearGradient>
  <radialGradient id="gLeaf" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#C6EAAF"/><stop offset=".6" stop-color="#93CB83"/><stop offset="1" stop-color="#5F9E5E"/></radialGradient>
  <radialGradient id="gLeafD" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#A9D894"/><stop offset="1" stop-color="#5A955A"/></radialGradient>
  <linearGradient id="gPine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9E2B4"/><stop offset="1" stop-color="#7FAE7A"/></linearGradient>
  <radialGradient id="gGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE9A6" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A6" stop-opacity="0"/></radialGradient>
</defs></svg>

<!-- 완성 연출 -->
<div id="birth">
  <div class="birth-box" id="birthBox">
    <svg class="cut" id="cutSvg" viewBox="0 0 300 380"><rect x="4" y="4" width="292" height="372" rx="26"/></svg>
    <div class="scissors" id="scis">✂️</div>
    <div class="sagak" id="sagak">사각!</div>
    <div class="birth-char" id="birthChar"></div>
    <div class="birth-msg" id="birthMsg"></div>

function mix(hex, to, t){
  const a=hex.match(/\w\w/g).map(h=>parseInt(h,16)), b=to.match(/\w\w/g).map(h=>parseInt(h,16));
  return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const shade=(h,t)=>mix(h,'#000000',t), tint=(h,t)=>mix(h,'#ffffff',t);
function josa(w,a,b){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return w+b; return w+((c-0xAC00)%28?a:b); }

  /* 뒷모습: 머리카락이 머리를 덮어요 */
  if(isH && o.back){
    const cover = m.hair==='short'
      ? "M31,106 C27,46 62,19 100,19 C138,19 173,46 169,106 C168,124 156,138 140,142 Q100,150 60,142 C44,138 32,124 31,106 Z"
      : "M31,106 C27,46 62,19 100,19 C138,19 173,46 169,106 C170,132 152,150 132,154 Q100,160 68,154 C48,150 30,132 31,106 Z";
    p+=`<path d="${cover}" fill="${U('h')}" ${LS}/><path d="M84,40 Q80,90 88,140 M116,40 Q120,90 112,140 M100,24 V146" fill="none" stroke="${shade(hc,.25)}" stroke-width="1.6" opacity=".35"/>`;
    if(m.hair==='curly') [[40,96,15],[46,66,17],[68,42,19],[100,31,21],[132,42,19],[154,66,17],[160,96,15],[56,130,15],[100,146,15],[144,130,15],[78,144,14],[122,144,14]].forEach(([x,y,r])=>p+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${U('h')}" ${LS}/>`);
    if(m.hair==='bun') p+=`<path d="M86,30 Q100,36 114,30" fill="none" stroke="#F3A6A0" stroke-width="4" stroke-linecap="round"/>`;
  }
  /* 앞머리 */
  if(isH && !o.back){
    const outer="M31,106 C27,46 62,19 100,19 C138,19 173,46 169,106";
    if(m.hair==='bob'||m.hair==='pigtails') p+=`<path d="${outer} C163,84 150,70 134,70 Q100,79 66,70 C50,70 37,84 31,106 Z" fill="${U('h')}" ${LS}/>`;
    if(m.hair==='bun') p+=`<path d="${outer} C165,86 146,66 100,66 C54,66 35,86 31,106 Z" fill="${U('h')}" ${LS}/>`;
    if(m.hair==='short') p+=`<path d="${outer} C160,80 134,57 100,65 C80,70 58,63 46,76 C38,86 33,96 31,106 Z" fill="${U('h')}" ${LS}/><path d="M100,20 C95,4 110,-2 113,9" fill="none" stroke="${hc}" stroke-width="5" stroke-linecap="round"/>`;
    if(m.hair==='long') p+=`<path d="${outer} C167,90 160,76 152,72 Q100,81 48,72 C40,76 33,90 31,106 Z" fill="${U('h')}" ${LS}/>`;
    if(m.hair==='curly'){
      p+=`<path d="M33,102 C29,48 62,22 100,22 C138,22 171,48 167,102 C158,74 134,60 100,60 C66,60 42,74 33,102 Z" fill="${U('h')}" ${LS}/>`;
      [[40,96,15],[46,66,17],[68,42,19],[100,31,21],[132,42,19],[154,66,17],[160,96,15]].forEach(([x,y,r])=>p+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${U('h')}" ${LS}/>`);
    }
  }
  /* 머리 위 소품 */
  if(m.prop==='beret'||m.prop==='crownberet'){
    if(m.prop==='crownberet') p+=`<path d="M70,26 L74,0 L86,14 L96,-4 L106,14 L118,0 L122,26 Z" fill="#F5C76E" ${LS}/><circle cx="96" cy="2" r="3" fill="#F3A6A0"/>`;
    const bc=m.prop==='crownberet'?'#B8A4E4':'#E46F6F';
    p+=`<defs>${rg('r',bc)}</defs><ellipse cx="96" cy="30" rx="47" ry="15" transform="rotate(-9 96 30)" fill="${U('r')}" ${LS}/><circle cx="${m.prop==='crownberet'?142:99}" cy="${m.prop==='crownberet'?24:14}" r="4.5" fill="${L}"/>`;
  }
  if(m.prop==='hairpin') p+=`<g transform="rotate(14 142 50)"><path d="M142,50 L126,40 L126,60 Z M142,50 L158,40 L158,60 Z" fill="#F2B6D3" ${LS1}/><circle cx="142" cy="50" r="5" fill="#F3A6A0" ${LS1}/></g>`;
  if(m.prop==='starpin') p+=`<path d="M142,34 L146.5,44 L157,45 L149,52 L151.5,62.5 L142,57 L132.5,62.5 L135,52 L127,45 L137.5,44 Z" fill="#F5C76E" ${LS}/>`;

  const ground = o.noShadow ? '' : `<ellipse cx="100" cy="223" rx="48" ry="8" fill="${U('g')}"/>`;
  return `<svg class="char-svg${o.viewBox?' crop':''}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs}</defs>${ground}<g class="c-bob">${p}</g></svg>`;
}

/* 캐릭터 붙이기: 클릭 반응 + 말풍선 */
const AV_OF = new WeakMap();
function mountChar(el, av, opt={}){
  el.innerHTML = `<div class="char-wrap ${opt.cls||''}"><div class="bubble"></div><div class="svgbox">${charSVG(av,{mood:opt.mood, back:opt.back})}</div></div>`;
  const w = el.firstElementChild;
  AV_OF.set(w, {av, mood:opt.mood, back:opt.back});
  if(opt.interactive!==false) w.addEventListener('click', ()=>poke(w));
  return w;
}
function say(w, text, ms=2200){
  const b=w.querySelector('.bubble'); b.textContent=text; b.classList.add('show');
  clearTimeout(w._bt); w._bt=setTimeout(()=>b.classList.remove('show'), ms);
}
function setMood(w, mood, ms){
  const st=AV_OF.get(w); if(!st) return;
  w.querySelector('.svgbox').innerHTML = charSVG(st.av,{mood, back:st.back});
  clearTimeout(w._mt);
  if(ms) w._mt=setTimeout(()=>{ w.querySelector('.svgbox').innerHTML = charSVG(st.av,{mood:st.mood, back:st.back}); }, ms);
}
function react(w){
  w.classList.remove('jump','wave'); void w.offsetWidth; w.classList.add('jump','wave');
  setTimeout(()=>w.classList.remove('jump'),650); setTimeout(()=>w.classList.remove('wave'),1900);
}
function poke(w){
  react(w); setMood(w,'happy',1400);
  say(w, CLICK_LINES[Math.floor(Math.random()*CLICK_LINES.length)]);
}

const STEPS=[
  {k:'body', n:'몸', t:'기본 몸을 골라 주세요'},
  {k:'color',n:'색', t:'피부 · 털 색'},
  {k:'face', n:'얼굴', t:'어떤 표정이 좋을까요?'},
  {k:'hair', n:'헤어/귀', t:''},
  {k:'outfit',n:'옷', t:'오늘의 옷'},
  {k:'prop', n:'소품·이름', t:'소품 하나와 이름'}
];
let AV=null, STEP=0, MODE='new', PREVIEW=null, BG='grid';
const CROP_FULL='-14 -44 228 296', CROP_HEAD='12 -40 176 196', CROP_FACE='34 40 132 104';

function openAvatar(mode){

}
function palFor(){ return AV.body==='human'?PALETTE.skin:PALETTE.fur; }
function setAV(k,v){
  if(k==='body'){
    const wasH=AV.body==='human', isH=v==='human';
    if(wasH!==isH){ const oldPal=wasH?PALETTE.skin:PALETTE.fur, newPal=isH?PALETTE.skin:PALETTE.fur;
      const i=Math.max(0,oldPal.indexOf(AV.color)); AV.color=newPal[Math.min(i,newPal.length-1)]; }
  }
  AV[k]=v; DATA.profile.avatar={...AV}; save();
  renderStage(true); renderStep();
}
function renderStage(bounce){
  const stage=document.getElementById('stage');
  let slot=stage.querySelector('.slot'); if(!slot){ slot=document.createElement('div'); slot.className='slot'; slot.style.zIndex=2; slot.style.position='relative'; stage.appendChild(slot); }

}
function renderBG(){

    <rect x="300" y="56" width="74" height="54" fill="#fff"/><path d="M292,58 L337,22 L382,58 Z" fill="#90B9E8"/><rect x="314" y="70" width="14" height="14" fill="#FFF0BA"/><rect x="346" y="70" width="14" height="14" fill="#FFF0BA"/>
    <circle cx="120" cy="96" r="14" fill="#C7E3C0"/><rect x="118" y="104" width="4" height="10" fill="#B9845A"/>
    <circle cx="268" cy="98" r="12" fill="#C7E3C0"/><rect x="266" y="104" width="4" height="10" fill="#B9845A"/></g>
    <path d="M150,30 q10,-12 22,0 q14,-4 14,8 q-22,6 -36,0 Z" fill="#fff" stroke="#3a3330" stroke-width="1.6"/></svg>`;
  else l.innerHTML='';

document.getElementById('bgTools').addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(!c) return; BG=c.dataset.bg; renderBG(); });

function renderPresets(){
  const box=document.getElementById('presets');
  let h='<div class="ttl">추천 프리셋으로 바로 시작하거나, 아래 단계에서 하나씩 골라 보세요</div>';
  PRESETS.forEach((p,i)=>{ h+=`<button class="preset" data-i="${i}">${charSVG(p.a,{viewBox:CROP_HEAD,simple:true,noShadow:true})}${p.title}</button>`; });

document.getElementById('presets').addEventListener('click', e=>{
  const b=e.target.closest('.preset'); if(!b) return;
  if(b.id==='randBtn'){ randomize(); return; }
  const p=PRESETS[+b.dataset.i]; AV={...p.a}; DATA.profile.avatar={...AV}; DATA.profile.charName=p.name; save();
  renderStage(true); renderStep(); say(PREVIEW, `나는 ${p.name}! 어때?`);
});
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randomize(){
  const body=pick(AVATAR_OPTIONS.body)[0];
  AV={ body, color:pick(body==='human'?PALETTE.skin:PALETTE.fur), eyes:pick(AVATAR_OPTIONS.eyes)[0], mouth:pick(AVATAR_OPTIONS.mouth)[0],
    blush:Math.random()<.8, hair:pick(AVATAR_OPTIONS.hair)[0], hairColor:pick(PALETTE.hair), ear:pick(AVATAR_OPTIONS.ear)[0],
    pattern:pick(AVATAR_OPTIONS.pattern)[0], outfit:pick(AVATAR_OPTIONS.outfit)[0], outfitColor:pick(PALETTE.outfit), prop:pick(AVATAR_OPTIONS.prop)[0] };
  DATA.profile.avatar={...AV}; save(); renderStage(true); renderStep(); say(PREVIEW,'짜잔! 새로운 나!');
}

function optTiles(key, crop, cls=''){
  return '<div class="opts">'+AVATAR_OPTIONS[key].map(([v,lab])=>{
    const a={...AV,[key]:v};
    return `<button class="opt ${cls} ${AV[key]===v?'on':''}" data-k="${key}" data-v="${v}">${charSVG(a,{viewBox:crop,simple:true,noShadow:true})}${lab}</button>`;
  }).join('')+'</div>';
}
function swatches(key, pal){
  return '<div class="swatches">'+pal.map(c=>`<button class="sw ${AV[key]===c?'on':''}" style="background:${c}" data-k="${key}" data-v="${c}" aria-label="${c}"></button>`).join('')+'</div>';
}
function isUnlocked(it){
  const a=DATA.attendance; if((DATA.profile.unlocked||[]).includes(it.id)) return true;
  return it.type==='streak' ? a.streak>=it.need : a.total>=it.need;
}
function renderStep(){
  const st=STEPS[STEP], isH=AV.body==='human';
  document.getElementById('steps').innerHTML = STEPS.map((s,i)=>`<button data-s="${i}" class="${i===STEP?'on':(i<STEP?'done':'')}"><b>${i+1}</b>${s.n}</button>`).join('');
  document.getElementById('prog').style.width=((STEP+1)/STEPS.length*100)+'%';
  let h='';
  if(st.k==='body'){ h+=`<p class="step-title">${st.t}</p>`+optTiles('body',CROP_FULL); }
  if(st.k==='color'){ h+=`<p class="step-title">${isH?'피부색':'털 색'}을 골라요</p><div class="sec">${isH?'피부색':'털 색'} (파스텔 톤)</div>`+swatches('color',palFor()); }
  if(st.k==='face'){
    h+=`<p class="step-title">${st.t}</p><div class="sec">눈</div>`+optTiles('eyes',CROP_FACE,'face');
    h+=`<div class="sec">입</div>`+optTiles('mouth',CROP_FACE,'face');
    h+=`<div class="sec">볼터치</div><span class="toggle ${AV.blush?'on':''}" id="blushT"><span class="tr"></span>발그레한 볼 ${AV.blush?'켜짐':'꺼짐'}</span>`;
  }
  if(st.k==='hair'){
    if(isH){ h+=`<p class="step-title">헤어스타일</p><div class="sec">머리 모양</div>`+optTiles('hair',CROP_HEAD)+`<div class="sec">머리색</div>`+swatches('hairColor',PALETTE.hair); }
    else { h+=`<p class="step-title">귀와 무늬</p><div class="sec">귀 모양</div>`+optTiles('ear',CROP_HEAD)+`<div class="sec">무늬</div>`+optTiles('pattern',CROP_HEAD); }
  }
  if(st.k==='outfit'){ h+=`<p class="step-title">${st.t}</p><div class="sec">옷 종류</div>`+optTiles('outfit',CROP_FULL)+`<div class="sec">옷 색</div>`+swatches('outfitColor',PALETTE.outfit); }
  if(st.k==='prop'){
    h+=`<p class="step-title">${st.t}</p><div class="sec">소품 (한 개만 착용)</div>`+optTiles('prop',CROP_FULL);
    h+=`<div class="sec">출석으로 열리는 아이템 🎁</div><div class="opts">`+UNLOCK_ITEMS.map(it=>{
      const ok=isUnlocked(it), a={...AV,prop:it.id};
      return ok ? `<button class="opt ${AV.prop===it.id?'on':''}" data-k="prop" data-v="${it.id}">${charSVG(a,{viewBox:CROP_FULL,simple:true,noShadow:true})}${it.label}</button>`
                : `<button class="opt locked" data-locked="${it.cond}">${charSVG(a,{viewBox:CROP_FULL,simple:true,noShadow:true})}<span class="lock">🔒</span>${it.label}<span class="cond">${it.cond}</span></button>`;
    }).join('')+`</div>`;
    h+=`<div class="sec">캐릭터 이름 (최대 8자)</div><input class="name-input" id="charName" maxlength="8" placeholder="예: ${pick(RANDOM_NAMES)}" value="${(DATA.profile.charName||'').replace(/"/g,'&quot;')}">`;
  }
  document.getElementById('stepBody').innerHTML=h;
  document.getElementById('prevBtn').disabled = STEP===0;
  document.getElementById('nextBtn').style.display = STEP===STEPS.length-1 ? 'none' : '';
  const bt=document.getElementById('blushT'); if(bt) bt.onclick=()=>setAV('blush',!AV.blush);
  const ni=document.getElementById('charName');
  if(ni) ni.addEventListener('input',()=>{ DATA.profile.charName=ni.value.trim(); save(); document.querySelector('#nametag span').textContent=DATA.profile.charName||'아직 없음'; });
}
document.getElementById('stepBody').addEventListener('click', e=>{
  const lk=e.target.closest('[data-locked]'); if(lk){ toast('🔒 '+lk.dataset.locked); if(PREVIEW) say(PREVIEW,'출석 열심히 하면 입을 수 있어!'); return; }
  const b=e.target.closest('[data-k]'); if(!b) return; setAV(b.dataset.k, b.dataset.v);
});
document.getElementById('steps').addEventListener('click', e=>{ const b=e.target.closest('[data-s]'); if(!b) return; STEP=+b.dataset.s; renderStep(); });
document.getElementById('prevBtn').onclick=()=>{ if(STEP>0){ STEP--; renderStep(); } };
document.getElementById('nextBtn').onclick=()=>{ if(STEP<STEPS.length-1){ STEP++; renderStep(); if(STEP===STEPS.length-1 && PREVIEW) say(PREVIEW,'이제 내 이름을 지어 줘!'); } };
document.getElementById('doneBtn').onclick=finishAvatar;

function finishAvatar(){
  if(!DATA.profile.charName){ DATA.profile.charName=pick(RANDOM_NAMES); toast(`이름이 없어서 '${DATA.profile.charName}'(으)로 지어 줬어요`); }
  DATA.profile.avatar={...AV};
  const wasNew = !DATA.profile.avatarDone;
  DATA.profile.avatarDone=true; save();
  if(MODE==='edit' && !wasNew){ toast('옷장에 저장했어요 👗'); enterVillage('edited'); }

/* 완성 연출: 사각! → 인사 → 걸어서 마을로 */
function birth(){
  const ov=document.getElementById('birth'); ov.classList.add('on');
  const cut=document.getElementById('cutSvg'), sc=document.getElementById('scis'), sg=document.getElementById('sagak'),
        bc=document.getElementById('birthChar'), msg=document.getElementById('birthMsg'), box=document.getElementById('birthBox');
  [cut,sc,sg,bc,msg,box].forEach(el=>el.classList.remove('draw','go','pop','show','walkout','walking'));
  const w=mountChar(bc, AV, {interactive:false});
  msg.textContent=`${josa(DATA.profile.charName,'이','가')} 태어났어요!`;
  void cut.offsetWidth; cut.classList.add('draw'); sc.classList.add('go');
  setTimeout(()=>{ bc.classList.add('pop'); sg.classList.add('pop'); }, 900);
  setTimeout(()=>{ msg.classList.add('show'); react(w); setMood(w,'happy'); say(w,`잘 부탁해, ${DATA.profile.nickname}!`,2600); }, 1500);
  setTimeout(()=>{ w.classList.add('walking'); box.classList.add('walkout'); say(w,'마을로 가자!',1400); }, 4000);
  setTimeout(()=>{ ov.classList.remove('on'); enterVillage('born'); }, 5300);
}

const W=1200, H=780;

let WORLD=null, P=null, NPCS=[], CAM={s:1,tx:0,ty:0,follow:false}, KEYS={}, NEAR=null, SPACE_OPEN=null, LAST_T=0, DUST_T=0, TUT=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function hitAt(x,y){
  if(x<34||x>W-34||y<70||y>H-14) return true;
  const fx1=x-13,fx2=x+13,fy1=y-6,fy2=y+3;
  for(const b of BUILDINGS){ const [a,c,d,e]=b.box; if(fx2>a&&fx1<d&&fy2>c&&fy1<e) return true; }
  for(const o of DECOR){ if(!o.box) continue; const [a,c,d,e]=o.box; if(fx2>a&&fx1<d&&fy2>c&&fy1<e) return true; }
  return false;
}
function buildWorld(){
  const w=document.getElementById('world'); WORLD=w;
  const doors=BUILDINGS.map(b=>b.door);
  let paths=doors.map(([x,y])=>`M600,${(y<440?430:470)} L${x},${y}`).join(' ')+' M600,500 L600,790';
  w.innerHTML=`<svg class="floor" viewBox="0 0 ${W} ${H}">
    <path d="${paths}" stroke="#E4D3B4" stroke-width="62" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="${paths}" stroke="#F1E6CF" stroke-width="52" stroke-linecap="round" fill="none"/>
    <ellipse cx="600" cy="452" rx="190" ry="122" fill="#E4D3B4" opacity=".75"/>
    <ellipse cx="600" cy="452" rx="184" ry="116" fill="#F3EADA"/>
    <ellipse cx="600" cy="452" rx="150" ry="94" fill="none" stroke="#E2D5BF" stroke-width="2"/><ellipse cx="600" cy="452" rx="116" ry="72" fill="none" stroke="#E2D5BF" stroke-width="2"/>
    ${Array.from({length:16},(_,i)=>{const a=i/16*Math.PI*2;return `<path d="M${600+Math.cos(a)*116},${452+Math.sin(a)*72} L${600+Math.cos(a)*184},${452+Math.sin(a)*116}" stroke="#E2D5BF" stroke-width="2"/>`}).join('')}
    ${[[600,560],[600,600],[600,640],[600,690],[600,740]].map(([x,y],i)=>`<ellipse cx="${x+(i%2?8:-8)}" cy="${y}" rx="14" ry="7" fill="#E2D5BF" stroke="#CDBD9F" stroke-width="1.5"/>`).join('')}
    ${[[160,300],[230,420],[1000,330],[1080,560],[420,700],[760,660],[150,600],[690,250],[340,500],[860,420],[1180,620],[40,250],[520,300],[980,760],[240,740]].map(([x,y])=>`<g stroke="#7FB06F" stroke-width="2" fill="none" stroke-linecap="round"><path d="M${x},${y} q2,-8 4,0 q2,-10 4,0 q2,-8 4,0"/></g>`).join('')}
  </svg>`;
  DECOR.forEach(o=>{ const d=document.createElement('div'); d.className='sprite'; Object.assign(d.style,{left:(o.x-o.w/2)+'px',top:(o.y-o.h)+'px',width:o.w+'px',height:o.h+'px',zIndex:o.y}); d.innerHTML=DECOR_SVG[o.t](o); w.appendChild(d); });
  BUILDINGS.forEach(b=>{ const d=document.createElement('div'); d.className='sprite bld'; d.dataset.b=b.id; b.el=d;
    Object.assign(d.style,{left:(b.x-b.w/2)+'px',top:(b.base-b.h)+'px',width:b.w+'px',height:b.h+'px',zIndex:b.base}); d.innerHTML=b.svg(); w.appendChild(d); });
  NPCS=NPC_DEFS.map((n,i)=>{ const el=document.createElement('div'); el.className='actor'; w.appendChild(el);
    const cw=mountChar(el,n.a); const tag=document.createElement('div'); tag.className='tag'; tag.textContent=n.name; el.appendChild(tag);
    const st=randomSpot(); return {...n, el, w:cw, x:st[0], y:st[1], tx:null, ty:null, wait:1+Math.random()*3, face:1, cd:2+i*1.5};
  });
  w.addEventListener('click', onWorldClick);
  window.addEventListener('resize', layoutWorld);
  requestAnimationFrame(tick);
}
function randomSpot(){ for(let i=0;i<40;i++){ const x=60+Math.random()*(W-120), y=100+Math.random()*(H-140); if(!hitAt(x,y)) return [x,y]; } return [600,600]; }
function placeActor(a){ a.el.style.transform=`translate(${a.x-38}px,${a.y-90}px)`; a.el.style.zIndex=Math.round(a.y)+1; a.el.classList.toggle('flip', a.face<0); }

function layoutWorld(){
  const wr=document.getElementById('worldWrap').getBoundingClientRect(); if(!wr.width) return;
  let s=Math.min(wr.width/W, wr.height/H); CAM.follow=s<0.66; if(CAM.follow) s=Math.min(1, Math.max(0.66, wr.width/W, wr.height/H));
  CAM.s=s; CAM.cw=wr.width; CAM.ch=wr.height; applyCam();
}
function applyCam(){
  const s=CAM.s; let tx,ty;
  if(W*s<=CAM.cw) tx=(CAM.cw-W*s)/2; else tx=clamp(CAM.cw/2-(P?P.x:600)*s, CAM.cw-W*s, 0);
  if(H*s<=CAM.ch) ty=(CAM.ch-H*s)/2; else ty=clamp(CAM.ch/2-(P?P.y:450)*s, CAM.ch-H*s, 0);
  CAM.tx=tx; CAM.ty=ty; WORLD.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
}
function toWorld(e){ const r=document.getElementById('worldWrap').getBoundingClientRect(); return [(e.clientX-r.left-CAM.tx)/CAM.s, (e.clientY-r.top-CAM.ty)/CAM.s]; }
function onWorldClick(e){
  if(!P || SPACE_OPEN) return;
  if(e.target.closest('.enter-pop')) return;
  if(e.target.closest('.actor')) return;
  const bEl=e.target.closest('.bld');
  if(bEl){ const b=BUILDINGS.find(x=>x.id===bEl.dataset.b);
    if(NEAR===b){ openSpace(b.id); return; }
    P.tx=b.door[0]; P.ty=b.door[1]-2; ring(b.door[0],b.door[1]); return; }
  const [x,y]=toWorld(e); P.tx=clamp(x,40,W-40); P.ty=clamp(y,74,H-18); ring(P.tx,P.ty);
}
function ring(x,y){ const r=document.createElement('div'); r.className='tap-ring'; r.style.left=x+'px'; r.style.top=y+'px'; r.style.zIndex=5; WORLD.appendChild(r); setTimeout(()=>r.remove(),520); }
function dust(x,y){ const d=document.createElement('div'); d.className='dust'; d.style.left=(x-5+(Math.random()*10-5))+'px'; d.style.top=(y-6)+'px'; d.style.zIndex=Math.round(y); d.style.setProperty('--dx',(Math.random()*16-8)+'px'); WORLD.appendChild(d); setTimeout(()=>d.remove(),620); }

window.addEventListener('keydown', e=>{
  if(!document.getElementById('village').classList.contains('on')) return;
  if(e.target.matches('input,textarea')) return;
  if(e.key==='Escape' && SPACE_OPEN){ closeSpace(); return; }
  if(SPACE_OPEN) return;
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){ KEYS[k]=true; e.preventDefault(); if(P) P.tx=null; }
  if((k==='enter'||k===' '||k==='e') && NEAR){ e.preventDefault(); openSpace(NEAR.id); }
});
window.addEventListener('keyup', e=>{ KEYS[e.key.toLowerCase()]=false; });
window.addEventListener('blur', ()=>{ KEYS={}; });

function tick(t){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(t-LAST_T)/1000||0); LAST_T=t;
  if(!P || !document.getElementById('village').classList.contains('on') || SPACE_OPEN) return;
  let dx=(KEYS.arrowright||KEYS.d?1:0)-(KEYS.arrowleft||KEYS.a?1:0), dy=(KEYS.arrowdown||KEYS.s?1:0)-(KEYS.arrowup||KEYS.w?1:0);
  if(!dx&&!dy&&P.tx!=null){ const vx=P.tx-P.x, vy=P.ty-P.y, d=Math.hypot(vx,vy); if(d<4) P.tx=null; else { dx=vx/d; dy=vy/d; } }
  const n=Math.hypot(dx,dy), moving=n>0;
  if(moving){ dx/=n; dy/=n; const sp=215*dt; let moved=false;
    const nx=P.x+dx*sp, ny=P.y+dy*sp;
    if(!hitAt(nx,P.y)){ P.x=nx; moved=true; } if(!hitAt(P.x,ny)){ P.y=ny; moved=true; }
    if(!moved){ P.tx=null; }
    if(dx<-0.15) P.face=-1; else if(dx>0.15) P.face=1;
    P.dist+=sp; DUST_T-=dt; if(DUST_T<=0 && moved){ dust(P.x,P.y); DUST_T=0.16; }
  }
  P.w.classList.toggle('walking', moving);
  placeActor(P);
  if(CAM.follow) applyCam();
  updateNear();
  updateNPCs(dt);
  if(TUT===1 && P.dist>150) tutStep(2);
}
function updateNear(){
  let best=null, bd=1e9;
  BUILDINGS.forEach(b=>{ const d=Math.hypot(P.x-b.door[0], P.y-b.door[1]); const lim=b.id==='fountain'?78:64; if(d<lim && d<bd){ best=b; bd=d; } });
  if(best!==NEAR){
    NEAR=best; if(TUT===2) WORLD.querySelectorAll('.tut-arrow').forEach(x=>x.style.display= best&&best.id==='house'?'none':''); WORLD.querySelectorAll('.enter-pop').forEach(x=>x.remove()); BUILDINGS.forEach(b=>b.el.classList.toggle('near', b===best));
    if(best){
      const pop=document.createElement('div'); pop.className='enter-pop';
      const q = best.id==='fountain' ? '볼까요?' : '들어갈까요?';
      pop.innerHTML=`<span>${best.emoji} <b class="en">${best.en}</b> ${q} <small>Enter</small></span><button>${best.id==='fountain'?'보기':'입장'}</button>`;
      pop.style.left=best.x+'px'; pop.style.top=(best.base-best.h-6)+'px';
      pop.querySelector('button').onclick=(e)=>{ e.stopPropagation(); openSpace(best.id); };
      WORLD.appendChild(pop);
    }
  }
}
function updateNPCs(dt){
  NPCS.forEach(n=>{
    n.cd-=dt;
    const dp=Math.hypot(n.x-P.x, n.y-P.y);
    if(dp<95 && n.cd<=0){ n.cd=10+Math.random()*6; n.face = P.x<n.x?-1:1; n.tx=null; n.wait=2.2; say(n.w, n.lines[Math.floor(Math.random()*n.lines.length)], 2400); }
    if(n.tx==null){ n.wait-=dt; if(n.wait<=0){ const s=randomSpot(); n.tx=s[0]; n.ty=s[1]; } }
    let moving=false;
    if(n.tx!=null){ const vx=n.tx-n.x, vy=n.ty-n.y, d=Math.hypot(vx,vy);
      if(d<3){ n.tx=null; n.wait=2+Math.random()*4; }
      else { const sp=58*dt, nx=n.x+vx/d*sp, ny=n.y+vy/d*sp; let mv=false;
        if(!hitAt(nx,n.y)){ n.x=nx; mv=true; } if(!hitAt(n.x,ny)){ n.y=ny; mv=true; }
        if(!mv){ n.tx=null; n.wait=1; } else moving=true;
        if(vx<-2) n.face=-1; else if(vx>2) n.face=1; } }
    n.w.classList.toggle('walking', moving); placeActor(n);
  });
}

function tutStep(n){

  WORLD.querySelectorAll('.tut-arrow').forEach(x=>x.remove());

  const texts={

function recomputeAttendance(){
  const A=DATA.attendance, set=new Set(A.dates), t=todayStr();
  A.dates=[...set].sort(); A.total=A.dates.length;
  let cur=set.has(t)?t:addDays(t,-1), st=0; while(set.has(cur)){ st++; cur=addDays(cur,-1); }
  A.streak=st;
  let best=0, run=0, prev=null; A.dates.forEach(d=>{ run = (prev && addDays(prev,1)===d) ? run+1 : 1; best=Math.max(best,run); prev=d; });
  A.best=best;
}

  UNLOCK_ITEMS.forEach(it=>{ const ok = it.type==='streak'?DATA.attendance.streak>=it.need:DATA.attendance.total>=it.need;
    if(ok && !DATA.profile.unlocked.includes(it.id)){ DATA.profile.unlocked.push(it.id); got.push(it); } });
  return got;
}

function renderTT(D, edit){
  const tt=document.getElementById('tt'); let h='';
  for(let r=0;r<TT_HOURS;r++){ h+=`<div class="r"><div class="h">${String(TT_START+r).padStart(2,'0')}</div>`;
    for(let c=0;c<6;c++){ const i=r*6+c, k=D.tt[i], col=k?CATS.find(x=>x[0]===k)[2]:''; h+=`<div class="c" data-i="${i}" style="${col?'background:'+col:''}"></div>`; } h+='</div>'; }
  tt.innerHTML=h; updateTTSum(D);
  if(!edit) return;
  document.getElementById('cats').onclick=e=>{ const bt=e.target.closest('[data-c]'); if(!bt) return; HV.cat=bt.dataset.c; document.querySelectorAll('#cats button').forEach(x=>x.classList.toggle('on',x===bt)); };
  if(!CATS.some(c=>c[0]===HV.cat)) HV.cat='study';
  // 드래그를 시작한 칸이 이미 지금 과목 색이면 → 이번 드래그는 지우기, 아니면 → 칠하기
  let painting=false, mode='paint';
  const paint=cell=>{ if(!cell||!cell.dataset.i) return; const d=day(todayStr()), i=+cell.dataset.i;
    if(mode==='erase'){ if(d.tt[i]===HV.cat){ d.tt[i]=null; cell.style.background=''; } }
    else { d.tt[i]=HV.cat; cell.style.background=CATS.find(x=>x[0]===HV.cat)[2]; } };
  tt.onpointerdown=e=>{ const cell=e.target.closest('.c'); if(!cell) return; const cur=day(todayStr()).tt[+cell.dataset.i];
    mode = cur===HV.cat ? 'erase' : 'paint'; tt.classList.toggle('erasing', mode==='erase');
    painting=true; tt.setPointerCapture(e.pointerId); paint(cell); };
  tt.onpointermove=e=>{ if(!painting) return; const el=document.elementFromPoint(e.clientX,e.clientY); if(el&&tt.contains(el)) paint(el.closest('.c')); };
  const stop=()=>{ if(!painting) return; painting=false; tt.classList.remove('erasing'); save(); updateTTSum(day(todayStr())); };
  tt.onpointerup=stop; tt.onpointercancel=stop;
}
function updateTTSum(D){

  document.getElementById('ttBars').innerHTML = n ? CATS.filter(c=>cnt[c[0]]).map(([k,l,c])=>`<i title="${l} ${fmtMin(cnt[k]*10)}" style="width:${cnt[k]/n*100}%;background:${c};display:block"></i>`).join('') : '';
}

function doPledge(){
  const t=todayStr(), inp=document.getElementById('pledgeIn'), hint=document.getElementById('pledgeHint'), v=inp.value.trim();
  if(v.length<5){ hint.textContent='다짐을 5자 이상 적어 주세요!'; hint.classList.add('err'); const b=document.getElementById('pledgeBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); inp.focus(); return; }
  const d=day(t); d.pledge=v; d.public=document.getElementById('pubIn').checked;
  if(attendedToday()){ syncPublic(t); save(); toast('✏️ 다짐을 고쳤어요 (포인트는 그대로예요)'); renderHouse(); return; }
  d.attended=true; DATA.attendance.dates.push(t); recomputeAttendance();

  if(s>=7 && s%7===0){ addPoints(POINT_RULES.streak7,`${s}일 연속 출석 보너스`); gained+=POINT_RULES.streak7; msgs.push(`🔥 ${s}일 연속 출석! +${POINT_RULES.streak7}P`); }

  const st=document.getElementById('attStamp'); if(st) st.classList.add('slam');

}

function recommend(){
  let cells=0, todos=0, notes=0;
  Object.values(DATA.planner).forEach(d=>{ cells+=(d.tt||[]).filter(Boolean).length; todos+=(d.todos||[]).length; notes+=(d.pledge?1:0)+(d.memo?1:0)+(d.review?1:0); });
  const sc={tenminute:cells/6, task:todos*1.2, diary:notes*1.5};
  const k=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
  return (cells+todos+notes)===0 ? {key:'tenminute', first:true} : {key:k};
}
