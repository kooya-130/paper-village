function fmtClock(sec){ sec=Math.max(0,Math.ceil(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function beep(times=3){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const t0=AC.currentTime;
    for(let i=0;i<times;i++){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value= i%2?880:660;
      g.gain.setValueAtTime(0,t0+i*.28); g.gain.linearRampToValueAtTime(.18,t0+i*.28+.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*.28+.24);
      o.connect(g).connect(sndOut()); o.start(t0+i*.28); o.stop(t0+i*.28+.26); } }catch(e){}
}
function phaseTotal(){ const s=tset(); return (TIMER.mode==='focus'?s.focus:s.brk)*60; }
function timerStart(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  if(TIMER.running) return;
  if(TIMER.remain<=0) TIMER.remain=phaseTotal();
  TIMER.running=true; TIMER.endAt=Date.now()+TIMER.remain*1000;
  if(TIMER.mode==='focus' && TIMER.remain===phaseTotal()) TIMER.startedAt=Date.now();
  if(TIMER.mode==='focus' && !TIMER.startedAt) TIMER.startedAt=Date.now();
  timerUI(true);
}
function timerPause(){ if(!TIMER.running) return; TIMER.remain=Math.max(0,(TIMER.endAt-Date.now())/1000); TIMER.running=false; timerUI(true); }
function timerReset(){ TIMER.running=false; TIMER.mode='focus'; TIMER.remain=tset().focus*60; TIMER.startedAt=0; timerUI(true); }
function recordFocus(startMs, endMs, cat, mins){
  const ds=todayStr(), d=day(ds);
  const a=new Date(startMs), b=new Date(endMs);
  const sMin=a.getHours()*60+a.getMinutes()-TT_START*60, eMin=b.getHours()*60+b.getMinutes()+(b.getSeconds()>0?1:0)-TT_START*60;
  let i1=Math.floor(sMin/10), i2=Math.max(i1, Math.ceil(eMin/10)-1), filled=0;
  for(let i=Math.max(0,i1); i<=Math.min(TT_HOURS*6-1,i2); i++){ d.tt[i]=cat; filled++; }
  DATA.study = DATA.study||{}; const st=DATA.study[ds]=DATA.study[ds]||{sessions:0,minutes:0};
  st.sessions++; st.minutes+=mins; save();
  return filled;
}
function finishPhase(){
  const s=tset();
  if(TIMER.mode==='focus'){
    const end=Date.now(), start=TIMER.startedAt || end-s.focus*60000;
    const filled=recordFocus(start,end,s.cat,s.focus);
    beep(3);
    toast(`🍅 집중 ${s.focus}분 완료! ${filled?'플래너 타임테이블에 칠해 뒀어요':'(06~24시 밖이라 타임테이블에는 표시되지 않아요)'}`);
    TIMER.mode='break'; TIMER.remain=s.brk*60; TIMER.startedAt=0; TIMER.running=true; TIMER.endAt=Date.now()+TIMER.remain*1000;
    if(SPACE_OPEN==='library'||SPACE_OPEN==='cafe') askDone(); else TIMER.pendingDone=true;
  } else {
    beep(2); toast('☕ 휴식 끝! 다시 집중해 볼까요?');
    TIMER.mode='focus'; TIMER.running=false; TIMER.remain=s.focus*60; TIMER.startedAt=0;
  }
  timerUI(true);
}
setInterval(()=>{
  if(TIMER.running){ TIMER.remain=(TIMER.endAt-Date.now())/1000; if(TIMER.remain<=0){ finishPhase(); return; } }
  timerUI(false);
}, 500);
function timerUI(full){
  const chip=document.getElementById('timerChip');
  if(chip){ const show=TIMER.running || (TIMER.remain>0 && TIMER.remain<phaseTotal());
    chip.style.display=show?'':'none'; chip.classList.toggle('b',TIMER.mode==='break');
    document.getElementById('timerChipT').textContent=fmtClock(TIMER.remain);
    document.getElementById('timerChipM').textContent=(TIMER.mode==='focus'?'집중':'휴식')+(TIMER.running?'':' · 멈춤'); }
  if(SPACE_OPEN!=='library') return;
  const tm=document.getElementById('tmTxt'); if(!tm) return;
  tm.textContent=fmtClock(TIMER.remain);
  const C=2*Math.PI*96, frac=Math.max(0,Math.min(1,TIMER.remain/phaseTotal()));
  const pr=document.getElementById('tmRing'); pr.setAttribute('stroke-dashoffset', C*(1-frac)); pr.setAttribute('stroke', TIMER.mode==='focus'?'#90B9E8':'#9FD3AA');
  if(!full) { updateSeats(); return; }
  const md=document.getElementById('tmMode'); md.className='md '+TIMER.mode; md.textContent = TIMER.mode==='focus'?(TIMER.running?'집중하는 중':'집중 준비'):'휴식 중 ☕';
  document.getElementById('tStart').style.display=TIMER.running?'none':''; document.getElementById('tPause').style.display=TIMER.running?'':'none';
  document.getElementById('tStart').textContent = (TIMER.remain>0 && TIMER.remain<phaseTotal()) ? '▶ 이어서' : '▶ 시작';
  const lock = TIMER.running || (TIMER.remain<phaseTotal());
  document.querySelectorAll('#tPre button, #tFocus, #tBreak').forEach(x=>x.disabled=lock);
  const st=(DATA.study||{})[todayStr()]||{sessions:0,minutes:0};
  document.getElementById('tomato').innerHTML=`<div class="tm2">${'🍅'.repeat(Math.min(st.sessions,12))||'<span style="color:var(--ink-soft);font-size:13px;letter-spacing:0">아직 집중 기록이 없어요</span>'}</div>오늘 집중 <b>${st.sessions}</b>회 · <b>${fmtMin(st.minutes)}</b>`;
  if(LIB_ME){ const want = TIMER.running&&TIMER.mode==='focus' ? 'focus' : (TIMER.mode==='break'?'break':'idle');
    if(LIB_ME._st!==want){ LIB_ME._st=want; LIB_ME.classList.toggle('studying', want==='focus'); setMood(LIB_ME, want==='break'?'happy':undefined);
      if(want==='break'){ react(LIB_ME); } } }
  updateSeats();
}

function feedPosts(){
  const mine=DATA.records.filter(r=>r.mine && r.public).map(r=>({...r, mine:true, au:-1}));

function scheduleCheers(r){
  if(!r.public || !(r.simLeft>0) || r._timer) return;
  r._timer=setTimeout(()=>{
    r._timer=null; const rec=DATA.records.find(x=>x.id===r.id); if(!rec || !rec.public){ return; }
    const [k,em,lab]=RX[Math.floor(Math.random()*RX.length)], who=CHEER_NAMES[Math.floor(Math.random()*CHEER_NAMES.length)];
    rec.cheers[k]=(rec.cheers[k]||0)+1; rec.simLeft=(rec.simLeft||1)-1;
    DATA.notifs.unshift({text:`${who}님이 "${rec.text.slice(0,18)}${rec.text.length>18?'…':''}"에 ${em} ${lab}를 남겼어요`, date:todayStr(), read:false});

    if(SPACE_OPEN==='cafe') renderFeed();

  }, 4000+Math.random()*8000);
}

/* ---------- 카페 재즈 (브라우저에서 직접 연주: 저작권 걱정 없는 생성형 음악) ---------- */
const JAZZ={ctx:null, master:null, noise:null, iv:null, next:0, step:0, playing:false, crackle:null};
const JAZZ_BPM=84;
const JAZZ_CHORDS=[ // [베이스 루트, 피아노 보이싱] Dm9 · G13 · Cmaj9 · A7 · Em9 · A13 · Dm9 · G7
  [38,[53,57,60,64]],[43,[53,59,64,69]],[36,[52,55,59,62]],[45,[55,61,65,67]],
  [40,[55,59,62,66]],[45,[55,61,64,67]],[38,[53,57,60,64]],[43,[53,59,62,65]]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function jazzVol(){ const v=DATA.settings.volume; return (v===undefined?.5:v); }
function jazzEnsure(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
  JAZZ.ctx=AC; if(AC.state==='suspended') AC.resume();
  if(!JAZZ.noise){ const len=AC.sampleRate; const buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; JAZZ.noise=buf; }
  return true;
}
function jNoise(t, dur, type, freq, gain, q=1){
  const c=JAZZ.ctx, s=c.createBufferSource(); s.buffer=JAZZ.noise; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(JAZZ.master); s.start(t, Math.random()*0.5); s.stop(t+dur+0.05);
}
function jTone(t, freq, dur, gain, type='sine', lp=2400){
  const c=JAZZ.ctx, o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  o.type=type; o.frequency.value=freq; o2.type='triangle'; o2.frequency.value=freq*2; o2.detune.value=4;
  const g2=c.createGain(); g2.gain.value=.12; f.type='lowpass'; f.frequency.value=lp;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.012); g.gain.exponentialRampToValueAtTime(gain*.35,t+0.18); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); o2.connect(g2).connect(g); g.connect(f).connect(JAZZ.master);
  o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
}
function jBass(t, m){
  const c=JAZZ.ctx, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  o.type='triangle'; o.frequency.value=mf(m); f.type='lowpass'; f.frequency.value=520;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.34,t+0.02); g.gain.exponentialRampToValueAtTime(.12,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+0.62);
  o.connect(f).connect(g).connect(JAZZ.master); o.start(t); o.stop(t+0.7);
}
function jKick(t){ const c=JAZZ.ctx, o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.connect(g).connect(JAZZ.master); o.start(t); o.stop(t+0.3); }
function jazzBeat(t, step){
  const beat=60/JAZZ_BPM, sw=beat*2/3, bar=Math.floor(step/4)%JAZZ_CHORDS.length, b=step%4;
  const [root, voi]=JAZZ_CHORDS[bar], nextRoot=JAZZ_CHORDS[(bar+1)%JAZZ_CHORDS.length][0];
  // 워킹 베이스
  const walk=[root, root+7, root+[9,10,12][Math.floor(Math.random()*3)], nextRoot+(Math.random()<.5?-1:1)];
  jBass(t, walk[b]);
  // 피아노 컴핑
  const comp=(tt,len,vel)=>voi.forEach((m,i)=>jTone(tt+i*0.008, mf(m), len, vel));
  if(b===0 && Math.random()<.9) comp(t,1.5,.055);
  if(b===1 && Math.random()<.55) comp(t+sw,.55,.042);
  if(b===2 && Math.random()<.3) comp(t,.8,.04);
  if(b===3 && Math.random()<.4) comp(t+sw,.5,.04);
  // 라이드 · 브러시 · 킥
  jNoise(t,.16,'highpass',7200,.035);
  if(b===1||b===3){ jNoise(t+sw,.09,'highpass',8000,.022); jNoise(t,.32,'bandpass',1700,.05,.7); jNoise(t,.05,'highpass',5000,.03); }
  if(b===0 && Math.random()<.7) jKick(t);
  // 비브라폰 멜로디 (가끔)
  if(Math.random()<.32){ const pool=voi.map(m=>m+12).concat([voi[0]+14, voi[1]+17]); const m=pool[Math.floor(Math.random()*pool.length)];
    jTone(t+(Math.random()<.5?0:sw), mf(m), 1.1, .05, 'sine', 4200); }
}
function jazzStart(){
  if(DATA.settings.cafeMusic===false) return;
  if(!jazzEnsure()) return;
  const c=JAZZ.ctx;
  if(!JAZZ.master){ JAZZ.master=c.createGain(); const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; JAZZ.master.connect(lp).connect(sndOut()); }
  JAZZ.master.gain.cancelScheduledValues(c.currentTime); JAZZ.master.gain.setValueAtTime(JAZZ.master.gain.value,c.currentTime); JAZZ.master.gain.linearRampToValueAtTime(jazzVol()*0.55, c.currentTime+1.2);
  if(JAZZ.playing) return;
  JAZZ.playing=true; JAZZ.next=c.currentTime+0.15; JAZZ.step=0;
  // LP 잡음 (로파이 느낌)
  const cr=c.createBufferSource(); cr.buffer=JAZZ.noise; cr.loop=true; const cf=c.createBiquadFilter(); cf.type='highpass'; cf.frequency.value=1800; const cg=c.createGain(); cg.gain.value=.012;
  cr.connect(cf).connect(cg).connect(JAZZ.master); cr.start(); JAZZ.crackle=cr;
  JAZZ.iv=setInterval(()=>{ while(JAZZ.next < c.currentTime+0.25){ jazzBeat(JAZZ.next, JAZZ.step); JAZZ.next+=60/JAZZ_BPM; JAZZ.step++; } }, 60);
  musicUI();
}
function jazzStop(){
  if(!JAZZ.playing) return; const c=JAZZ.ctx; JAZZ.playing=false;
  JAZZ.master.gain.cancelScheduledValues(c.currentTime); JAZZ.master.gain.setValueAtTime(JAZZ.master.gain.value,c.currentTime); JAZZ.master.gain.linearRampToValueAtTime(0,c.currentTime+0.8);
  clearInterval(JAZZ.iv); const cr=JAZZ.crackle; setTimeout(()=>{ try{ cr&&cr.stop(); }catch(e){} }, 900);
  musicUI();
}
function musicUI(){
  const m=document.getElementById('musicBox'); if(!m) return; const on=DATA.settings.cafeMusic!==false;
  m.classList.toggle('playing', JAZZ.playing);
  const bt=document.getElementById('musicBtn'); bt.textContent = on?'🎵 재즈 켜짐':'🔇 재즈 꺼짐'; bt.classList.toggle('on',on);
}

/* ---------- 도서관 백색소음 (브라우저에서 직접 생성) ---------- */
const AMB={playing:false, mode:null, nodes:[], iv:null, master:null, pink:null, brown:null};
const AMB_MODES=[['white','🤫 백색소음'],['rain','🌧 빗소리'],['off','🔇 끄기']];
function ambMode(){ return DATA.settings.libSound||'white'; }
function ambVol(){ const v=DATA.settings.libVolume; return v===undefined?.5:v; }
function ambBuffers(){
  const c=AC, n=c.sampleRate*4;
  if(!AMB.pink){ const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
    AMB.pink=b; }
  if(!AMB.brown){ const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; } AMB.brown=b; }
}
function ambLoop(buf, type, freq, gain){
  const c=AC, s=c.createBufferSource(); s.buffer=buf; s.loop=true; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=c.createGain(); g.gain.value=gain; s.connect(f).connect(g).connect(AMB.master); s.start(0, Math.random()*3); AMB.nodes.push(s); return g;
}
function ambBurst(t, dur, type, f1, f2, gain){
  const c=AC, s=c.createBufferSource(); s.buffer=AMB.pink; const f=c.createBiquadFilter(); f.type=type; f.Q.value=1.2;
  f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+dur*.25); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AMB.master); s.start(t, Math.random()*3); s.stop(t+dur+.05);
}
function ambDrop(t){ const c=AC, o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(1800+Math.random()*2600,t); o.frequency.exponentialRampToValueAtTime(900,t+.04);
  g.gain.setValueAtTime(.012+Math.random()*.015,t); g.gain.exponentialRampToValueAtTime(.0001,t+.05); o.connect(g).connect(AMB.master); o.start(t); o.stop(t+.06); }
function ambStart(){
  const mode=ambMode(); if(mode==='off'){ ambStop(); return; }
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ return; }
  if(AMB.playing && AMB.mode===mode){ AMB.master.gain.setTargetAtTime(ambVol()*.9, AC.currentTime, .2); return; }
  if(AMB.playing) ambStop(true);
  ambBuffers(); const c=AC;
  AMB.master=c.createGain(); AMB.master.gain.value=0; AMB.master.connect(sndOut());
  AMB.master.gain.linearRampToValueAtTime(ambVol()*.9, c.currentTime+1.5);
  AMB.mode=mode; AMB.playing=true; AMB.nodes=[];
  if(mode==='white'){ ambLoop(AMB.pink,'lowpass',1300,.55); ambLoop(AMB.brown,'lowpass',260,.35); }
  else { ambLoop(AMB.pink,'highpass',700,.45); ambLoop(AMB.pink,'lowpass',500,.22); ambLoop(AMB.brown,'lowpass',200,.3); }
  let nextPage=c.currentTime+4+Math.random()*6, nextPencil=c.currentTime+2+Math.random()*4;
  AMB.iv=setInterval(()=>{ const t=c.currentTime;
    if(t>nextPage){ ambBurst(t+.05,.42,'bandpass',700,3200,.07); if(Math.random()<.5) ambBurst(t+.5,.3,'bandpass',900,2600,.04); nextPage=t+12+Math.random()*14; }
    if(t>nextPencil){ const k=5+Math.floor(Math.random()*8); for(let i=0;i<k;i++) ambBurst(t+.05+i*(.09+Math.random()*.05),.07,'highpass',3500,5500,.025); nextPencil=t+7+Math.random()*10; }
    if(AMB.mode==='rain'){ const n=3+Math.floor(Math.random()*5); for(let i=0;i<n;i++) ambDrop(t+Math.random()*.2); }
  }, 200);
  ambUI();
}
function ambStop(quick){
  if(!AMB.playing) return; AMB.playing=false; clearInterval(AMB.iv);
  const m=AMB.master, ns=AMB.nodes; m.gain.cancelScheduledValues(AC.currentTime); m.gain.setValueAtTime(m.gain.value,AC.currentTime); m.gain.linearRampToValueAtTime(0,AC.currentTime+(quick?.2:1));
  setTimeout(()=>{ ns.forEach(s=>{ try{ s.stop(); }catch(e){} }); try{ m.disconnect(); }catch(e){} }, quick?250:1100);
  AMB.nodes=[]; ambUI();
}
function ambUI(){

function monthStats(ym, demo){

  const daysSoFar = ym===t.slice(0,7) ? +t.slice(8,10) : last;

    const days=Array.from({length:last},(_,i)=>({d:i+1, min: i<daysSoFar? seed[i%seed.length]*30:0, at: i<daysSoFar && seed[i%seed.length]>1}));
    return {demo:true, last, daysSoFar, days, attend:days.filter(x=>x.at).length, best:7, kept:12, reviews:15, points:385, minutes:days.reduce((a,x)=>a+x.min,0), sessions:23,
      cats:{study:1860,task:640,read:420,work:180,etc:120}, types:{공부:9,다짐:14,독서:3,일상:4}, pledges:['오늘은 기출 1세트 끝내기','핸드폰 보기 전에 플래너 채우기','영단어 50개 외우기'], rec:'tenminute'}; }
  const set=new Set(DATA.attendance.dates.filter(d=>d.startsWith(ym)));
  const days=[]; let minutes=0; const cats={}; let kept=0, reviews=0; const pledges=[];
  for(let d=1; d<=last; d++){ const ds=`${ym}-${String(d).padStart(2,'0')}`, P=DATA.planner[ds]; let mn=0;
    if(P){ (P.tt||[]).forEach(k=>{ if(k){ mn+=10; cats[k]=(cats[k]||0)+10; } }); if(P.review){ reviews++; if(P.review==='o') kept++; } if(P.pledge) pledges.push(P.pledge); }
    minutes+=mn; days.push({d, min:mn, at:set.has(ds)}); }
  let best=0, run=0; days.forEach(x=>{ run = x.at ? run+1 : 0; best=Math.max(best,run); });
  const points=DATA.points.history.filter(h=>h.date.startsWith(ym)&&h.delta>0).reduce((a,h)=>a+h.delta,0);

  const types={}; DATA.records.filter(r=>r.mine&&r.date.startsWith(ym)).forEach(r=>types[r.type]=(types[r.type]||0)+1);
  return {demo:false, last, daysSoFar, days, attend:set.size, best, kept, reviews, points, minutes, sessions, cats, types, pledges:pledges.slice(-3).reverse(), rec:recommend().key};
}

}

    const ul=document.getElementById('mkList');

    o.querySelector('#codeGo').onclick=()=>{ try{ const v=o.querySelector('#codeIn').value.trim().replace(/^MOTE-NOTE:/,''); const j=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!Array.isArray(j.b)) throw 0; WS.blocks=j.b.filter(k=>NB_BLOCKS[k]); WS.name=j.n||'불러온 노트'; WS.purpose=NB_PRESETS[j.p]?j.p:'공부'; o.remove(); viewMaker(el); toast('📥 양식을 불러왔어요'); }catch(_){ toast('코드가 올바르지 않아요'); } }; };

function drawDiary(){
  const pg=document.getElementById('dkPage'); if(!pg) return;
  pg.innerHTML=diarySVG(WS.dv,{cls:'dk-canvas'});
  const svg=pg.querySelector('svg');
  const mark=()=>{ svg.querySelectorAll('.selbox').forEach(x=>x.remove()); if(!WS.sel) return; const g=svg.querySelector(`.ditem[data-id="${WS.sel}"]`); if(!g) return; g.classList.add('sel');
    const bb=g.getBBox(); const r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('class','selbox'); r.setAttribute('x',bb.x-6); r.setAttribute('y',bb.y-6); r.setAttribute('width',bb.width+12); r.setAttribute('height',bb.height+12); r.setAttribute('fill','none'); r.setAttribute('stroke','#E0823A'); r.setAttribute('stroke-width','2'); r.setAttribute('stroke-dasharray','5 4'); r.setAttribute('rx','6'); g.appendChild(r); };
  mark(); selTool();
  const pt=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  let drag=null;
  svg.onpointerdown=e=>{ const g=e.target.closest('.ditem'); if(!g){ WS.sel=null; svg.querySelectorAll('.ditem.sel').forEach(x=>x.classList.remove('sel')); mark(); selTool(); return; }
    const it=WS.dv.items.find(x=>x.id===g.dataset.id); WS.sel=it.id; svg.querySelectorAll('.ditem.sel').forEach(x=>x.classList.remove('sel')); mark(); selTool();
    const p=pt(e); drag={it, g, dx:p.x-it.x, dy:p.y-it.y}; svg.setPointerCapture(e.pointerId); e.preventDefault(); };
  svg.onpointermove=e=>{ if(!drag) return; const p=pt(e); drag.it.x=Math.max(0,Math.min(PAGE_W,p.x-drag.dx)); drag.it.y=Math.max(0,Math.min(PAGE_H,p.y-drag.dy)); drag.g.setAttribute('transform',`translate(${drag.it.x},${drag.it.y}) rotate(${drag.it.r}) scale(${drag.it.s})`); };
  svg.onpointerup=svg.onpointercancel=()=>{ drag=null; };
}
function selTool(){
  const box=document.getElementById('dkSel'); if(!box) return; const it=WS.dv.items.find(x=>x.id===WS.sel);
  if(!it){ box.innerHTML='<span style="color:var(--ink-soft)">👆 페이지의 스티커 · 테이프를 누르면 크기 · 회전 · 삭제를 할 수 있어요</span>'; return; }
  box.innerHTML=`<b>선택됨</b> ${it.type==='sticker'?it.k:it.type==='tape'?'마스킹테이프':'날짜 도장'} <button data-op="up">＋ 크게</button><button data-op="down">－ 작게</button><button data-op="rot">↻ 회전</button><button data-op="front">맨 앞으로</button><button data-op="del" style="color:#c4554c">🗑 삭제</button>`;
  box.onclick=e=>{ const op=e.target.dataset.op; if(!op) return; const i=WS.dv.items.indexOf(it);
    if(op==='up') it.s=Math.min(3,+(it.s+.15).toFixed(2)); if(op==='down') it.s=Math.max(.4,+(it.s-.15).toFixed(2)); if(op==='rot') it.r=(it.r+15)%360;
    if(op==='front'){ WS.dv.items.splice(i,1); WS.dv.items.push(it); } if(op==='del'){ WS.dv.items.splice(i,1); WS.sel=null; }
    drawDiary(); };
}

/* 내 보관함 */
function viewVault(el){
  const T=DATA.templates, D=DATA.diaryPages;
  el.innerHTML=`<div class="wsec">🧩 내 내지 양식 <small>${T.length}개</small></div>
    <div class="vault">${T.length?T.map(t=>`<div class="gcard">${pageSVG(t.blocks,t.name,t.purpose)}<b>${esc(t.name)}</b><small>${t.purpose} · ${t.date.slice(5).replace('-','/')}</small><div class="row2"><button class="pbtn" data-edit-t="${t.id}">열기</button><button class="pbtn" data-img-t="${t.id}">이미지</button><button class="pbtn" data-del-t="${t.id}">삭제</button></div></div>`).join(''):'<p class="notice" style="grid-column:1/-1">아직 저장한 양식이 없어요. 🧩 나만의 내지 만들기에서 저장해 보세요.</p>'}</div>
    <div class="wsec">🎨 내 일기 페이지 <small>${D.length}장</small></div>
    <div class="vault">${D.length?D.map(d=>`<div class="gcard">${diarySVG(d)}<small>${d.date.slice(5).replace('-','/')} · ${DIARY_THEMES[d.theme]?DIARY_THEMES[d.theme].name:'직접 꾸미기'}</small><div class="row2"><button class="pbtn" data-edit-d="${d.id}">열기</button><button class="pbtn" data-img-d="${d.id}">이미지</button><button class="pbtn" data-del-d="${d.id}">삭제</button></div></div>`).join(''):'<p class="notice" style="grid-column:1/-1">아직 저장한 일기가 없어요. 🎨 오늘의 일기 꾸미기에서 저장해 보세요.</p>'}</div>`;
  el.onclick=e=>{ const ds=e.target.dataset;
    if(ds.editT){ const t=T.find(x=>x.id===ds.editT); WS.blocks=[...t.blocks]; WS.name=t.name; WS.purpose=t.purpose; WS.tab='maker'; renderWS(); }
    if(ds.imgT){ const t=T.find(x=>x.id===ds.imgT); showImage(pageSVG(t.blocks,t.name,t.purpose), t.name); }
    if(ds.delT){ DATA.templates=T.filter(x=>x.id!==ds.delT); save(); renderWS(); }
    if(ds.editD){ const d=D.find(x=>x.id===ds.editD); WS.dv=JSON.parse(JSON.stringify(d)); WS.sel=null; WS.tab='diary'; renderWS(); }
    if(ds.imgD){ const d=D.find(x=>x.id===ds.imgD); showImage(diarySVG(d), '일기 페이지'); }
    if(ds.delD){ DATA.diaryPages=D.filter(x=>x.id!==ds.delD); save(); renderWS(); } };
}

/* =========================================================
   공간별 배경음 (모두 브라우저에서 직접 생성 · 음원 파일 없음)
   마을: 바람 · 새 · 먼 분수 · 마림바 / 집: 시계 · 포근한 화음 · 연필
   카페: 웅성거림 · 잔 소리 (+재즈) / 분수대: 물소리 · 물방울 · 새 / 공작소: 종이 · 가위 · 오르골
   도서관은 백색소음(AMB), 카페 재즈(JAZZ)는 따로 켜고 끌 수 있어요.
   ========================================================= */
const SND={master:null, cur:null, want:null, white:null};
function sndOut(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  if(!SND.master){ SND.master=AC.createGain(); SND.master.gain.value = DATA.settings.sound===false?0:sndVol(); SND.master.connect(AC.destination); }
  return SND.master;
}
function sndVol(){ const v=DATA.settings.masterVol; return v===undefined?.8:v; }
function sndBufs(){
  if(!AC) return; if(!SND.white){ const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; SND.white=b; }
  if(!JAZZ.noise) JAZZ.noise=SND.white; ambBuffers();
}
function sndApplyMaster(){ if(!SND.master) return; const on=DATA.settings.sound!==false; SND.master.gain.setTargetAtTime(on?sndVol():0, AC.currentTime, .15); sndUI(); }
/* 소리 재료 */
function sLoop(sc, buf, type, freq, gain, q=.8){ const s=AC.createBufferSource(); s.buffer=buf; s.loop=true; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=AC.createGain(); g.gain.value=gain; s.connect(f).connect(g).connect(sc.bus); s.start(0,Math.random()*1.5); sc.nodes.push(s); return g; }
function sLfo(sc, param, rate, depth){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=rate; g.gain.value=depth; o.connect(g).connect(param); o.start(); sc.nodes.push(o); }
function sBurst(sc, t, dur, type, f1, f2, gain, buf){ const s=AC.createBufferSource(); s.buffer=buf||AMB.pink; const f=AC.createBiquadFilter(); f.type=type; f.Q.value=1.1; f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+dur*.2); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f).connect(g).connect(sc.bus); s.start(t,Math.random()); s.stop(t+dur+.05); }
function sNote(sc, t, freq, dur, gain, type='sine', harm=0){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(sc.bus); o.start(t); o.stop(t+dur+.05);
  if(harm){ const o2=AC.createOscillator(), g2=AC.createGain(); o2.frequency.value=freq*harm; g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(gain*.25,t+.005); g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.4); o2.connect(g2).connect(sc.bus); o2.start(t); o2.stop(t+dur); } }
function sPad(sc, t, freqs, dur, gain){ freqs.forEach(f=>{ const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter(); o.type='triangle'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=900;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+dur*.35); g.gain.linearRampToValueAtTime(0,t+dur); o.connect(lp).connect(g).connect(sc.bus); o.start(t); o.stop(t+dur+.05); }); }
function sBird(sc, t){ const n=2+Math.floor(Math.random()*4), base=2600+Math.random()*1600;
  for(let i=0;i<n;i++){ const o=AC.createOscillator(), g=AC.createGain(), tt=t+i*(.09+Math.random()*.05); o.frequency.setValueAtTime(base*(1+Math.random()*.15),tt); o.frequency.exponentialRampToValueAtTime(base*(Math.random()<.5?1.5:.75),tt+.07);
    g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.035,tt+.01); g.gain.exponentialRampToValueAtTime(.0001,tt+.08); o.connect(g).connect(sc.bus); o.start(tt); o.stop(tt+.1); } }
function sTick(sc, t, hi){ sBurst(sc,t,.03,'bandpass',hi?3200:2300,hi?3000:2100,.09,SND.white); }
function sDrop(sc, t){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(900+Math.random()*900,t); o.frequency.exponentialRampToValueAtTime(1800+Math.random()*900,t+.06);
  g.gain.setValueAtTime(.03,t); g.gain.exponentialRampToValueAtTime(.0001,t+.09); o.connect(g).connect(sc.bus); o.start(t); o.stop(t+.1); }
const mF=m=>440*Math.pow(2,(m-69)/12);
const PENTA=[0,2,4,7,9];
/* 장면 */
const SCENES={
  village(sc){ sLfo(sc, sLoop(sc,AMB.brown,'lowpass',420,.2).gain, .09, .08); sLoop(sc,AMB.pink,'bandpass',1500,.025,.6);
    const beat=60/76; let nb=AC.currentTime+2, nm=AC.currentTime+.5, step=0; const roots=[48,53,55,57];
    return ()=>{ const t=AC.currentTime; if(t>nb){ sBird(sc,t+.05); nb=t+3+Math.random()*6; }
      while(nm<t+.25){ const bar=Math.floor(step/4)%4, r=roots[bar];
        if(step%4===0) sNote(sc,nm,mF(r),2.2,.05,'sine');
        if(Math.random()<.55){ const m=60+12*(Math.random()<.35?1:0)+PENTA[Math.floor(Math.random()*5)]; sNote(sc,nm+(Math.random()<.3?beat/2:0),mF(m),.9,.045,'sine',4); }
        nm+=beat; step++; } }; },
  house(sc){ sLoop(sc,AMB.brown,'lowpass',220,.14); let nt=AC.currentTime+.3, hi=true, np=AC.currentTime+.5, nc=AC.currentTime+6, ci=0;
    const chords=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
    return ()=>{ const t=AC.currentTime; while(nt<t+.2){ sTick(sc,nt,hi); hi=!hi; nt+=1; }
      if(t>np){ sPad(sc,t+.05,chords[ci%4].map(mF),6.5,.022); ci++; np=t+5.5; }
      if(t>nc){ const k=5+Math.floor(Math.random()*7); for(let i=0;i<k;i++) sBurst(sc,t+.05+i*(.08+Math.random()*.05),.07,'highpass',3500,5200,.03); nc=t+9+Math.random()*10; } }; },
  cafe(sc){ const a=sLoop(sc,AMB.pink,'bandpass',520,.16,.5), b=sLoop(sc,AMB.pink,'bandpass',1150,.06,.7); sLfo(sc,a.gain,.23,.06); sLfo(sc,b.gain,.37,.03);
    let nk=AC.currentTime+1.5, ns=AC.currentTime+20;
    return ()=>{ const t=AC.currentTime; if(t>nk){ const f=2400+Math.random()*1400; sNote(sc,t+.02,f,.35,.03,'sine',2.7); if(Math.random()<.4) sNote(sc,t+.12,f*1.08,.25,.02,'sine'); nk=t+2+Math.random()*5; }
      if(t>ns){ sBurst(sc,t,2.2,'highpass',2500,4000,.035); ns=t+25+Math.random()*20; } }; },
  fountain(sc){ const w=sLoop(sc,AMB.pink,'bandpass',1400,.22,.6), h=sLoop(sc,AMB.pink,'highpass',3200,.05); sLfo(sc,w.gain,3.1,.05); sLfo(sc,h.gain,5.3,.02); sLoop(sc,AMB.brown,'lowpass',380,.12);
    let nd=AC.currentTime+.2, nb=AC.currentTime+3;
    return ()=>{ const t=AC.currentTime; if(t>nd){ sDrop(sc,t+Math.random()*.1); nd=t+.12+Math.random()*.35; } if(t>nb){ sBird(sc,t); nb=t+4+Math.random()*7; } }; },
  workshop(sc){ sLoop(sc,AMB.brown,'lowpass',240,.12); const beat=60/88; let nm=AC.currentTime+.4, step=0, nr=AC.currentTime+2, ns=AC.currentTime+6;
    return ()=>{ const t=AC.currentTime;
      while(nm<t+.25){ if(Math.random()<.5){ const m=79+PENTA[Math.floor(Math.random()*5)]-(Math.random()<.3?12:0); sNote(sc,nm,mF(m),1.4,.035,'triangle',2); } if(step%8===0) sNote(sc,nm,mF(67),1.8,.025,'triangle'); nm+=beat/2; step++; }
      if(t>nr){ sBurst(sc,t,.45,'bandpass',800,3000,.07); if(Math.random()<.5) sBurst(sc,t+.5,.3,'bandpass',1000,2600,.05); nr=t+3+Math.random()*4; }
      if(t>ns){ [0,.16].forEach(d=>sBurst(sc,t+d,.05,'highpass',4500,6500,.08,SND.white)); ns=t+6+Math.random()*7; } }; },
  library(){ return null; }
};
function sceneTo(name){
  SND.want=name;
  if(SND.cur && SND.cur.name===name) return;
  if(SND.cur){ const old=SND.cur; SND.cur=null; clearInterval(old.iv); try{ old.bus.gain.setTargetAtTime(0,AC.currentTime,.35); }catch(e){} setTimeout(()=>{ old.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); try{ old.bus.disconnect(); }catch(e){} }, 1600); }
  if(!name || !SCENES[name] || !AC) return;
  const out=sndOut(); if(!out) return; sndBufs();
  const sc={name, nodes:[], bus:AC.createGain()}; sc.bus.gain.value=0; sc.bus.connect(out);
  sc.bus.gain.setTargetAtTime(1, AC.currentTime+.1, .6);
  const tick=SCENES[name](sc); if(tick) sc.iv=setInterval(tick, 100);
  SND.cur=sc;
}
// 첫 클릭/키 입력 때 소리를 깨워요 (브라우저 자동재생 정책)
function sndUnlock(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ return; }
  sndOut(); if(SND.want && (!SND.cur || SND.cur.name!==SND.want)) sceneTo(SND.want); }
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev, sndUnlock, {capture:true}));
function sndUI(){
  const on=DATA.settings.sound!==false;
  document.querySelectorAll('.snd-toggle').forEach(b=>{ b.textContent=on?'🔊':'🔇'; b.title=on?'소리 끄기':'소리 켜기'; b.classList.toggle('off',!on); });
  const t=document.getElementById('sndBtn'); if(t) t.textContent=on?'🔊 소리 켜짐':'🔇 소리 꺼짐';
}
function sndToggle(){ DATA.settings.sound = DATA.settings.sound===false; save(); sndOut(); sndApplyMaster(); if(DATA.settings.sound!==false && SND.want) sceneTo(SND.want); toast(DATA.settings.sound===false?'🔇 소리를 껐어요':'🔊 소리를 켰어요'); }

/* =========================================================
   시작
   ========================================================= */
renderBG();
if(DATA.profile && DATA.profile.avatarDone){ renderStart(); enterVillage(); }
else if(DATA.profile){ openAvatar('new'); }
else { renderStart(); show('start'); }
</script>
